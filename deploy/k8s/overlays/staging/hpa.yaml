apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dwara-controller
  namespace: dwara-system
  labels:
    app.kubernetes.io/name: dwara
    app.kubernetes.io/component: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dwara-controller
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
