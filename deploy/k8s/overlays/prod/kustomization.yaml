# Prod overlay: 3 replicas, high resources, HPA + PDB + NetworkPolicy +
# ServiceMonitor. Pinned image tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dwara-prod
resources:
  - ../../base
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
namespace: dwara-system
namePrefix: prod-
patches:
  - target:
      kind: Deployment
      name: dwara-controller
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/cpu
        value: 2000m
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/memory
        value: 256Mi
images:
  - name: ghcr.io/shristilabs/dwara-k8s-controller
    newTag: v0.1.0
  - name: ghcr.io/shristilabs/dwara
    newTag: v0.1.0
