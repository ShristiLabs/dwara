apiVersion: v1
kind: Service
metadata:
  name: dwara-controller
  namespace: dwara-system
  labels:
    app.kubernetes.io/name: dwara
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dwara
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
