[package]
name = "dwara-cli"
description = "Command-line client for administering a dwara gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dwara-core = { path = "../dwara-core" }
clap = { workspace = true }
# Lint rule "regex shadowed by exact" compiles route regexes (DW-022);
# already a workspace dependency (route matching).
regex = { workspace = true }
# Atomic fmt writes (temp file + rename, mirroring dwara-admin's
# config writer): already a workspace dependency.
tempfile = { workspace = true }
# dwara-loadgen (DW-024): the load-generator rig lives in the lib
# (src/loadgen.rs; src/bin/loadgen.rs is a thin wrapper, and the unit
# tests in tests/loadgen_unit.rs exercise the lib API). tokio/hyper are
# already workspace dependencies of the gateway crates; no new external
# crates.
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `schema` subcommand (DW-026): pretty-print the schemars JSON Schema.
# Already a workspace dependency (dwara-core/observability uses it); no
# new external crate enters the tree.
serde_json = { workspace = true }
# `import openapi` subcommand (DW-047): parse OpenAPI specs (YAML or
# JSON). Already a workspace dependency (dwara-core config parsing); no
# new external crate enters the tree.
serde_yaml_ng = { workspace = true }
# `import openapi` subcommand: derive Deserialize on the minimal
# OpenAPI struct. Already a workspace dependency; no new external
# crate enters the tree.
serde = { workspace = true }
# DW-049 `upgrade` subcommand: sends SIGUSR2 to a running gateway (by
# PID file or --pid) to trigger a zero-downtime binary upgrade. libc is
# already in the tree transitively; this only makes it a direct one.
# MIT OR Apache-2.0.
libc = { workspace = true }

[features]
# DW-064: Kubernetes Gateway API controller + conformance report. When
# enabled, the `dwara k8s` subcommand and the `dwara-k8s-controller` binary
# are compiled. Default OFF: kube-rs + k8s-openapi add significant binary
# size. Build with `cargo build --features k8s`.
k8s = ["dwara-core/k8s"]
# DW-066: CP/DP split (Enterprise). When enabled, the
# `dwara-controller` and `dwara-edge` binaries are compiled. Default
# OFF: tonic + prost add binary size. Build with
# `cargo build --features ent`.
ent = ["dwara-core/ent"]

# DW-024 load generator (see src/loadgen.rs docs).
[[bin]]
name = "dwara-loadgen"
path = "src/bin/loadgen.rs"

# DW-064: Kubernetes Gateway API controller binary. Feature-gated behind
# the `k8s` feature so the default build never pulls in kube-rs.
[[bin]]
name = "dwara-k8s-controller"
path = "src/bin/k8s_controller.rs"
required-features = ["k8s"]

# DW-066: CP/DP split controller binary (Enterprise). Feature-gated
# behind the `ent` feature so the default build never pulls in tonic.
[[bin]]
name = "dwara-controller"
path = "src/bin/dwara_controller.rs"
required-features = ["ent"]

# DW-066: CP/DP split edge binary (Enterprise). Feature-gated behind
# the `ent` feature so the default build never pulls in tonic.
[[bin]]
name = "dwara-edge"
path = "src/bin/dwara_edge.rs"
required-features = ["ent"]
