[package]
name = "dwara-cli"
description = "Command-line client for administering a dwara gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dwara-core = { path = "../dwara-core" }
clap = { workspace = true }
# Lint rule "regex shadowed by exact" compiles route regexes (DW-022);
# already a workspace dependency (route matching).
regex = { workspace = true }
# Atomic fmt writes (temp file + rename, mirroring dwara-admin's
# config writer): already a workspace dependency.
tempfile = { workspace = true }
# dwara-loadgen (DW-024): the load-generator bench binary ships as a bin
# target of this crate (src/bin/loadgen.rs). tokio/hyper are already
# workspace dependencies of the gateway crates; no new external crates.
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `schema` subcommand (DW-026): pretty-print the schemars JSON Schema.
# Already a workspace dependency (dwara-core/observability uses it); no
# new external crate enters the tree.
serde_json = { workspace = true }

# DW-024 load generator (see src/bin/loadgen.rs docs).
[[bin]]
name = "dwara-loadgen"
path = "src/bin/loadgen.rs"
