[package]
name = "dwara-cli"
description = "Command-line client for administering a dwara gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dwara-core = { path = "../dwara-core" }
clap = { workspace = true }
# USA-02 (#179): shell-completion generation (bash/zsh/fish/PowerShell)
# via clap_complete. Already a workspace dependency (MIT OR Apache-2.0);
# no new external crate enters the tree.
clap_complete = { workspace = true }
# Lint rule "regex shadowed by exact" compiles route regexes (DW-022);
# already a workspace dependency (route matching).
regex = { workspace = true }
# Atomic fmt writes (temp file + rename, mirroring dwara-admin's
# config writer): already a workspace dependency.
tempfile = { workspace = true }
# dwara-loadgen (DW-024): the load-generator rig lives in the lib
# (src/loadgen.rs; src/bin/loadgen.rs is a thin wrapper, and the unit
# tests in tests/loadgen_unit.rs exercise the lib API). tokio/hyper are
# already workspace dependencies of the gateway crates; no new external
# crates.
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `schema` subcommand (DW-026): pretty-print the schemars JSON Schema.
# Already a workspace dependency (dwara-core/observability uses it); no
# new external crate enters the tree.
serde_json = { workspace = true }
# `import openapi` subcommand (DW-047): parse OpenAPI specs (YAML or
# JSON). Already a workspace dependency (dwara-core config parsing); no
# new external crate enters the tree.
serde_yaml_ng = { workspace = true }
# `import openapi` subcommand: derive Deserialize on the minimal
# OpenAPI struct. Already a workspace dependency; no new external
# crate enters the tree.
serde = { workspace = true }
# DW-049 `upgrade` subcommand: sends SIGUSR2 to a running gateway (by
# PID file or --pid) to trigger a zero-downtime binary upgrade. libc is
# already in the tree transitively; this only makes it a direct one.
# MIT OR Apache-2.0.
libc = { workspace = true }
# DW-102 `replay --from/--to`: reads raw rows from the analytics
# SQLite store. Already a workspace dependency (dwara-core/state uses
# it); no new external crate enters the tree. MIT.
rusqlite = { workspace = true }
# SCALE-12 (#192): SHA-256 digest verification for plugin registry
# downloads. Already a workspace dependency (dwara-core uses it for
# API-key hashing); no new external crate enters the tree.
sha2 = { workspace = true }
# DW-066: tracing subscriber for the ent controller/edge binaries (the
# same registry + EnvFilter + JSON fmt stack dwara-bin installs).
# Optional + ent-gated so the default CLI build never pulls it in.
# Already a workspace dependency of dwara-bin (MIT OR Apache-2.0).
tracing-subscriber = { workspace = true, optional = true }
# REL-15 (#250): tracing macros for the ent controller binary's fleet
# config attachment logging. Optional + ent-gated.
tracing = { workspace = true, optional = true }
# PERF-06 (#171): HTTP/3 (QUIC) load generation in dwara-loadgen. quinn
# is the QUIC transport, h3 is the HTTP/3 framing, h3-quinn bridges them;
# rustls + webpki-roots are the TLS stack for the h3 client. All five are
# already workspace dependencies (allow-listed in deny.toml; MIT OR
# Apache-2.0) used by dwara-bin's h3 ingress and dwara-core's h3 upstream.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# USA-10 (#251): `validate --watch` file watcher. Already a workspace
# dependency (dwara-bin uses it for config hot-reload). MIT OR Apache-2.0.
notify = { workspace = true }

[features]
# DW-066: CP/DP split (Enterprise). When enabled, the
# `dwara-controller` and `dwara-edge` binaries are compiled. Default
# OFF: tonic + prost add binary size. Build with
# `cargo build --features ent`.
ent = ["dwara-core/ent", "dep:tracing-subscriber", "dep:tracing"]

# DW-024 load generator (see src/loadgen.rs docs).
[[bin]]
name = "dwara-loadgen"
path = "src/bin/loadgen.rs"

# DW-064: Kubernetes Gateway API controller binary.
[[bin]]
name = "dwara-k8s-controller"
path = "src/bin/k8s_controller.rs"

# DW-066: CP/DP split controller binary (Enterprise). Feature-gated
# behind the `ent` feature so the default build never pulls in tonic.
[[bin]]
name = "dwara-controller"
path = "src/bin/dwara_controller.rs"
required-features = ["ent"]

# DW-066: CP/DP split edge binary (Enterprise). Feature-gated behind
# the `ent` feature so the default build never pulls in tonic.
[[bin]]
name = "dwara-edge"
path = "src/bin/dwara_edge.rs"
required-features = ["ent"]
