# Default dwara configuration, loaded when DWARA_CONFIG is not set and the
# binary runs from this directory. The served response is still the M1 hello
# placeholder; the config drives validation and the hot-reload snapshot.
listeners:
  - name: main
    address: 0.0.0.0
    port: 8080
routes:
  - name: v1
    service: echo
    match:
      path:
        type: prefix
        value: /v1
    action:
      type: proxy
services:
  - name: echo
    upstream: echo-upstream
upstreams:
  - name: echo-upstream
    endpoints:
      - address: 127.0.0.1
        port: 9000
