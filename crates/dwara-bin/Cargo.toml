[package]
name = "dwara-bin"
description = "Gateway server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# DW-032: the ent feature forwards to dwara-core's ent feature so the
# binary's #[cfg(feature = "ent")] license-verification path compiles in.
dwara-core = { path = "../dwara-core" }
dwara-admin = { path = "../dwara-admin" }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
notify = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# #124: zeroizes the credential-pepper copy captured by the state-store
# seed closure after hashing (same crate dwara-core already zeroizes with).
zeroize = { workspace = true }
# #126: OTLP trace export of the DW-021 span tree. The wiring lives in
# src/otlp.rs. async-trait/http/bytes serve the std-only exporter HTTP
# client (opentelemetry-http's HttpClient impl).
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-proto = { workspace = true }
tracing-opentelemetry = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# DW-073: protobuf encoding for OTLP metrics export.
prost = { workspace = true }
# DW-073: prometheus metric types for the OTLP metrics encoder. Already
# a transitive dep via dwara-core; this makes it direct for the encoder
# in src/otlp.rs.
prometheus = { workspace = true }
# DW-031: Redis client for the distributed rate limiter connection
# establishment at startup (ent feature only). Optional so OSS builds
# never pull it in; enabled via the `ent` feature. Same workspace dep
# as dwara-core (BSD-3-Clause, allow-listed in deny.toml).
redis = { workspace = true, optional = true }
# DW-049 zero-downtime binary upgrade: socket2 sets SO_REUSEPORT on the
# listening sockets so a new process can bind the same port during the
# SIGUSR2 hand-off window. Already in the tree transitively; this only
# makes it a direct one. MIT OR Apache-2.0.
socket2 = { workspace = true }
# DW-088: HTTP/3 (QUIC) ingress. quinn is the QUIC transport, h3 is the
# HTTP/3 framing, h3-quinn bridges them. The wiring lives in src/h3.rs.
# All three are MIT-licensed (allow-listed in deny.toml).
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
# DW-097: tokio-console subscriber for async task diagnostics. The
# console-subscriber layer spawns a gRPC server (default
# 127.0.0.1:6669) that the `tokio-console` CLI connects to. The wiring
# is inline in main.rs (the layer is added to the tracing registry).
# MIT-licensed (allow-listed in deny.toml).
console-subscriber = { workspace = true }

[features]
# DW-032: Enterprise edition. Forwards to dwara-core's `ent` feature so
# the binary's license-verification startup path compiles in. Default
# OFF: OSS builds keep the license block inert (the gate is always
# none()). Build with `cargo build --features ent` (or
# `--features dwara-bin/ent`) to enable license verification.
ent = ["dwara-core/ent", "dwara-admin/ent", "dep:redis"]

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
# #128: raw-h2 test client for the protocol_hardening suite's HTTP/2
# limit tests (window-gated flow). DEV-ONLY: never linked into the
# gateway binary or library builds. h2 is MIT, the same crate (and
# version, 0.4) hyper already pulls in transitively, so it adds no new
# license or duplicate-version surface for cargo-deny.
h2 = "0.4"

[[bin]]
name = "dwara"
path = "src/main.rs"
