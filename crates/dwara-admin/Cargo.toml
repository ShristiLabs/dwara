[package]
name = "dwara-admin"
description = "Admin API and management-plane surface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dwara-core = { path = "../dwara-core" }
dwara-console = { path = "../dwara-console" }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
# Atomic config writes (PATCH /config): tempfile is MIT/Apache-2.0 and
# already a workspace dependency (dev-only elsewhere); persist() gives
# the write-to-temp + rename dance without shell tricks.
tempfile = { workspace = true }

[features]
# SCALE-05 (#184): workspace admin endpoints. When enabled, the admin
# API exposes /workspaces, /roles, /principals, and /audit endpoints
# backed by the workspace manager (which requires dwara-core's ent
# feature).
ent = ["dwara-core/ent"]

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Analytics endpoint tests seed the embedded store's SQLite file
# directly (DW-043); the store API itself is exercised through
# dwara-core's suites.
rusqlite = { workspace = true }
