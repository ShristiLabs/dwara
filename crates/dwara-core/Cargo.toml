[package]
name = "dwara-core"
description = "Core gateway engine: config model, routing, and dataplane assembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml_ng = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
governor = { workspace = true }
matchit = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# #121: PEM parsing for the trusted_ca_file validation-time check in
# snapshot::validate (an external crate, so the crate:: dependency
# direction between domains is unaffected).
rustls-pki-types = { workspace = true }
# #120: zeroizes PEM/DER private-key buffers on drop in security::tls.
zeroize = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# DW-063: http::request::Parts type for the hedge_race helper signature.
http = { workspace = true }
# DW-030: PROXY protocol v1/v2 header parsing on opt-in listeners
# (dataplane::proxy_proto owns the framing/bounds/fail-closed policy).
ppp = { workspace = true }
# DW-050: GeoIP (MaxMind-format) database reading for geo rules.
maxminddb = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tower-service = { workspace = true }
webpki-roots = { workspace = true }
# REL-08 (#219): OS-native root CA store for `use_system_roots` upstreams.
rustls-native-certs = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration.workspace = true
subtle = { workspace = true }
sha2 = { workspace = true }
# Credential pepper (#124): hmac-sha256:<hex> stored-hash format in
# config::credentials / security::authn (see the workspace comment).
hmac = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
# DW-032: license expiry / grace-period arithmetic (extensions/licensing).
# MIT OR Apache-2.0; already in the tree via jsonwebtoken.
chrono = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
# Local response cache backend (DW-037): see the workspace comment.
moka = { workspace = true }
# Response compression codecs (DW-027): see the workspace comment.
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
# Concurrency model checker (DW-025, optional): MIT/Apache-2.0. Optional so
# it never enters production builds; the `loom` feature gates the
# primitive swap in health.rs/breaker.rs/retries.rs and the rate
# limiter's shard store (extensions/rate_limiter.rs, #122).
loom = { version = "0.7", optional = true }
# DW-032: Enterprise licensing primitives (optional, ent feature only).
# licensing-core is BSL-1.1; see the workspace Cargo.toml comment and
# deny.toml. Optional so OSS builds (the default) never pull it in. The
# canonical source is the private git repo
# https://github.com/ShristiLabs/licensing. CI configures git to
# authenticate via the GITHUB_TOKEN env var (see the ci workflow's
# "Configure git for private deps" step).
licensing-core = { workspace = true, optional = true }
# DW-031: Redis client for the distributed rate limiter (ent feature only).
# redis is BSD-3-Clause (allow-listed in deny.toml). Optional so OSS builds
# (the default) never pull it in; enabled via the `ent` feature. The
# `tokio-comp` feature enables the async API (ConnectionManager).
redis = { workspace = true, optional = true }
# DW-042: DNS-based dynamic upstream discovery. hickory-resolver is
# MIT OR Apache-2.0 (both allow-listed in deny.toml). Regular (non-
# optional) dep — this is the OSS edition and discovery is a core
# feature. The `tokio` feature gives the async TokioAsyncResolver.
hickory-resolver = { workspace = true }
# DW-055: proxy-wasm host runtime. wasmtime is the WebAssembly engine
# that runs proxy-wasm filters. Apache-2.0 WITH LLVM-exception
# (allow-listed in deny.toml). Unconditional in the OSS default build.
wasmtime = { workspace = true }
# DW-058: CEL (Common Expression Language) engine. cel-interpreter
# provides parse, type-check, and interpret. MIT (allow-listed in
# deny.toml). Unconditional in the OSS default build.
cel-interpreter = { workspace = true }
# PERF-09 (#260): CEL JIT compilation via cranelift. Optional deps for
# the cel-jit feature. Apache-2.0 WITH LLVM-exception (allow-listed).
cranelift-jit = { version = "0.134", default-features = false, optional = true }
cranelift-module = { version = "0.134", default-features = false, optional = true }
cranelift-codegen = { version = "0.134", default-features = false, optional = true }
cranelift-frontend = { version = "0.134", default-features = false, optional = true }
cranelift-native = { version = "0.134", default-features = false, optional = true }
cel-parser = { version = "0.10", default-features = false, optional = true }
# DW-060: Cedar policy engine. cedar-policy is AWS's Rust-native
# authorization policy language. Apache-2.0 (allow-listed in deny.toml).
# Unconditional in the OSS default build.
cedar-policy = { workspace = true }
# DW-070: OpenAPI response validation. jsonschema is a JSON Schema
# validator. MIT (allow-listed in deny.toml). Unconditional in the OSS
# default build.
jsonschema = { workspace = true }
# DW-064: Kubernetes Gateway API controller. kube-rs (Apache-2.0) is the
# Rust Kubernetes client; k8s-openapi (Apache-2.0 OR MIT) provides the
# built-in API types. The `v1_32` feature on k8s-openapi pins a specific
# Kubernetes API version (not `latest`). Unconditional in the OSS default
# build.
kube = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
# DW-066: gRPC transport for the CP/DP split (ent feature only). tonic is
# MIT (allow-listed in deny.toml). Optional so OSS builds (the default)
# never pull it in; enabled via the `ent` feature. default-features = false
# + ["transport", "codegen"] avoids tonic's prost 0.13 -- we use the
# workspace prost 0.14 for hand-written messages via a custom Codec impl.
tonic = { workspace = true, optional = true }
# DW-066: prost for hand-written protobuf wire messages in the CP/DP
# transport layer (ent feature only) and the gRPC-Web framing +
# JSON-to-gRPC transcoding (DW-101, OSS). Already a workspace dep (0.14,
# used by dwara-bin's OTLP metrics encoder). MIT OR Apache-2.0 (both
# allow-listed). Unconditional in the OSS default build so gRPC-Web,
# protocol translation, and SOAP compile without a feature flag.
prost = { workspace = true }
# DW-066: tokio-stream for wrapping mpsc receivers as Stream items in the
# CP/DP gRPC server-streaming transport (ent feature only). Already pulled
# in transitively by tonic; this makes it a direct dep. MIT.
tokio-stream = { workspace = true, optional = true }
# DW-083: HNSW ANN index for semantic caching (embedding-similarity cache
# for AI prompts). MIT OR Apache-2.0. Unconditional in the OSS default
# build.
hnsw_rs = { workspace = true }
# DW-108: HTTP/3 (QUIC) upstream transport. quinn is the QUIC transport,
# h3 is the HTTP/3 framing layer, h3-quinn bridges them (all MIT, the
# same crates the DW-088 H3 ingress uses on dwara-bin). Unconditional in
# the OSS default build.
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }

[features]
# DW-025: swaps the health/breaker/retry-budget/rate-limiter-shard
# synchronization primitives for loom's model-checked equivalents. Never
# enabled in production builds or the default test run; exercised by
# `cargo test --features loom` and the fuzz.yml CI job.
loom = ["dep:loom"]
# DW-032: Enterprise edition features. When enabled, the gateway can
# verify a ShristiLabs license file and gate enterprise features (Redis
# rate limiter, config convergence, etc.) behind license claims. OSS
# builds (the default) compile without the licensing-core or redis
# dependencies.
ent = ["dep:licensing-core", "dep:redis", "dep:tonic", "dep:tokio-stream"]
# PERF-09 (#260): CEL JIT compilation via cranelift. When enabled, CEL
# expressions are JIT-compiled to native code for faster evaluation.
# Falls back to the tree-walking interpreter for complex expressions.
cel-jit = [
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
    "dep:cel-parser",
]

[dev-dependencies]
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
# The DW-027 compression round-trip tests use flate2/brotli/zstd as
# decoders; they are regular [dependencies] of this crate, and test
# targets link against those too, so they are deliberately NOT repeated
# here.
serde_json = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true }
# Micro-benchmarks (DW-024): criterion is dev/bench-only; it never ships in
# the gateway binary or library builds.
criterion = { workspace = true }
# DW-050 tests: generate .mmdb fixtures at runtime (dev-only;
# Apache-2.0 OR MIT).
mmdb-writer = { workspace = true }
# DW-042 tests: in-process DNS authority/server for deterministic
# discovery tests. MIT OR Apache-2.0. Dev-only.
hickory-server = { workspace = true }
# DW-055 tests: WAT (WebAssembly Text) parser for compiling test
# proxy-wasm modules from source at test time. Apache-2.0 WITH
# LLVM-exception (allow-listed in deny.toml). Dev-only.
wast = "258"

[[bench]]
name = "micro"
harness = false

# DW-058: CEL engine benchmark.
[[bench]]
name = "cel"
harness = false
