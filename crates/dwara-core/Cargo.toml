[package]
name = "dwara-core"
description = "Core gateway engine: config model, routing, and dataplane assembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_path_to_error = { workspace = true }
serde_yaml_ng = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
governor = { workspace = true }
matchit = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# #121: PEM parsing for the trusted_ca_file validation-time check in
# snapshot::validate (an external crate, so the crate:: dependency
# direction between domains is unaffected).
rustls-pki-types = { workspace = true }
# #120: zeroizes PEM/DER private-key buffers on drop in security::tls.
zeroize = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
# DW-063: http::request::Parts type for the hedge_race helper signature.
http = { workspace = true }
# DW-030: PROXY protocol v1/v2 header parsing on opt-in listeners
# (dataplane::proxy_proto owns the framing/bounds/fail-closed policy).
ppp = { workspace = true }
# DW-050: GeoIP (MaxMind-format) database reading for geo rules.
maxminddb = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tower-service = { workspace = true }
webpki-roots = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration.workspace = true
subtle = { workspace = true }
sha2 = { workspace = true }
# Credential pepper (#124): hmac-sha256:<hex> stored-hash format in
# config::credentials / security::authn (see the workspace comment).
hmac = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
# DW-032: license expiry / grace-period arithmetic (extensions/licensing).
# MIT OR Apache-2.0; already in the tree via jsonwebtoken.
chrono = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
# Local response cache backend (DW-037): see the workspace comment.
moka = { workspace = true }
# Response compression codecs (DW-027): see the workspace comment.
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
# Concurrency model checker (DW-025, optional): MIT/Apache-2.0. Optional so
# it never enters production builds; the `loom` feature gates the
# primitive swap in health.rs/breaker.rs/retries.rs and the rate
# limiter's shard store (extensions/rate_limiter.rs, #122).
loom = { version = "0.7", optional = true }
# DW-032: Enterprise licensing primitives (optional, ent feature only).
# licensing-core is BSL-1.1; see the workspace Cargo.toml comment and
# deny.toml. Optional so OSS builds (the default) never pull it in. The
# canonical source is the private git repo
# https://github.com/ShristiLabs/licensing. CI configures git to
# authenticate via the GITHUB_TOKEN env var (see the ci workflow's
# "Configure git for private deps" step).
licensing-core = { workspace = true, optional = true }
# DW-031: Redis client for the distributed rate limiter (ent feature only).
# redis is BSD-3-Clause (allow-listed in deny.toml). Optional so OSS builds
# (the default) never pull it in; enabled via the `ent` feature. The
# `tokio-comp` feature enables the async API (ConnectionManager).
redis = { workspace = true, optional = true }
# DW-042: DNS-based dynamic upstream discovery. hickory-resolver is
# MIT OR Apache-2.0 (both allow-listed in deny.toml). Regular (non-
# optional) dep — this is the OSS edition and discovery is a core
# feature. The `tokio` feature gives the async TokioAsyncResolver.
hickory-resolver = { workspace = true }
# DW-055: proxy-wasm host runtime. wasmtime is the WebAssembly engine
# that runs proxy-wasm filters. Optional so the default build never
# pulls it in; enabled via the `wasm` feature. Apache-2.0 WITH
# LLVM-exception (allow-listed in deny.toml).
wasmtime = { workspace = true, optional = true }
# DW-058: CEL (Common Expression Language) engine. cel-interpreter
# provides parse, type-check, and interpret. Optional so the default
# build never pulls it in; enabled via the `cel` feature. MIT
# (allow-listed in deny.toml).
cel-interpreter = { workspace = true, optional = true }
# DW-060: Cedar policy engine. cedar-policy is AWS's Rust-native
# authorization policy language. Optional so the default build never
# pulls it in; enabled via the `cedar` feature. Apache-2.0
# (allow-listed in deny.toml).
cedar-policy = { workspace = true, optional = true }
# DW-070: OpenAPI response validation. jsonschema is a JSON Schema
# validator. Optional so the default build never pulls it in; enabled
# via the `openapi_validation` feature. MIT (allow-listed in
# deny.toml).
jsonschema = { workspace = true, optional = true }
# DW-064: Kubernetes Gateway API controller. kube-rs (Apache-2.0) is the
# Rust Kubernetes client; k8s-openapi (Apache-2.0 OR MIT) provides the
# built-in API types. Both are optional so the default build never pulls
# them in; enabled via the `k8s` feature. The `v1_32` feature on
# k8s-openapi pins a specific Kubernetes API version (not `latest`).
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true, features = ["v1_32"] }
# DW-066: gRPC transport for the CP/DP split (ent feature only). tonic is
# MIT (allow-listed in deny.toml). Optional so OSS builds (the default)
# never pull it in; enabled via the `ent` feature. default-features = false
# + ["transport", "codegen"] avoids tonic's prost 0.13 -- we use the
# workspace prost 0.14 for hand-written messages via a custom Codec impl.
tonic = { workspace = true, optional = true }
# DW-066: prost for hand-written protobuf wire messages in the CP/DP
# transport layer (ent feature only). Already a workspace dep (0.14, used
# by dwara-bin's OTLP metrics encoder); this makes it a direct dep of
# dwara-core so the ent-gated cp_dp transport module can derive
# prost::Message. MIT OR Apache-2.0 (both allow-listed).
# DW-101: also enabled by the `grpc_web` feature for gRPC-Web framing +
# JSON-to-gRPC transcoding (OSS, no license required).
prost = { workspace = true, optional = true }
# DW-066: tokio-stream for wrapping mpsc receivers as Stream items in the
# CP/DP gRPC server-streaming transport (ent feature only). Already pulled
# in transitively by tonic; this makes it a direct dep. MIT.
tokio-stream = { workspace = true, optional = true }
# DW-083: HNSW ANN index for semantic caching (embedding-similarity cache
# for AI prompts). Optional so the default build never pulls it in;
# enabled via the `semantic_cache` feature. MIT OR Apache-2.0.
hnsw_rs = { workspace = true, optional = true }
# DW-108: HTTP/3 (QUIC) upstream transport. quinn is the QUIC transport,
# h3 is the HTTP/3 framing layer, h3-quinn bridges them (all MIT, the
# same crates the DW-088 H3 ingress uses on dwara-bin). Optional so the
# default build never pulls them in; enabled via the `h3` feature. The
# upstream connector (dataplane::upstream_h3) and the QUIC active health
# probe (dataplane::active) compile only with the feature on.
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

[features]
# DW-025: swaps the health/breaker/retry-budget/rate-limiter-shard
# synchronization primitives for loom's model-checked equivalents. Never
# enabled in production builds or the default test run; exercised by
# `cargo test --features loom` and the fuzz.yml CI job.
loom = ["dep:loom"]
# DW-032: Enterprise edition features. When enabled, the gateway can
# verify a ShristiLabs license file and gate enterprise features (Redis
# rate limiter, config convergence, etc.) behind license claims. OSS
# builds (the default) compile without the licensing-core or redis
# dependencies.
ent = ["dep:licensing-core", "dep:redis", "dep:tonic", "dep:prost", "dep:tokio-stream"]
# DW-055: proxy-wasm host. When enabled, the gateway can load and run
# proxy-wasm ABI filters (community Kong/Envoy filters run unmodified).
# Default OFF: wasmtime + cranelift are significant binary size against
# the DW-026 25MB budget. Build with `cargo build --features wasm`.
wasm = ["dep:wasmtime"]
# DW-106: WASM route handlers (nano-services). When enabled, a route
# action can run a WASM module that generates the response directly
# (instead of proxying to an upstream). The module implements a simple
# request->response handler ABI over the existing wasmtime runtime
# (brought in by the `wasm` feature). Default OFF: it depends on the
# wasm runtime (wasmtime + cranelift), which is significant binary size
# against the DW-026 25MB budget. The config schema is always present
# (so configs round-trip without the feature); when the feature is off
# the action is accepted but inert (validation warns, the route returns
# 502). Build with `cargo build --features nano_services`.
nano_services = ["wasm"]
# DW-119: native plugin filter trait + unified dispatch chain. When
# enabled, the gateway can run compile-in Rust filters (linked into the
# binary at build time) alongside proxy-wasm plugins, selected by config
# with no dataplane-visible difference in attachment semantics. Default
# OFF: it is the convenience/performance extension path, not the
# portable ABI. Build with `cargo build --features plugins` (combine
# with `wasm` for both). The trait + registry are dependency-free.
plugins = []
# DW-058: CEL engine. When enabled, the gateway can compile and
# evaluate CEL expressions at config publish time (never on the
# request path). Default OFF: cel-interpreter adds binary size.
# Build with `cargo build --features cel`.
cel = ["dep:cel-interpreter"]
# DW-060: Cedar + OPA authorization. When enabled, the gateway can
# evaluate Cedar policies for fine-grained authorization and call out
# to OPA via HTTP with a decision cache. Default OFF: cedar-policy
# adds binary size. Build with `cargo build --features cedar`.
cedar = ["dep:cedar-policy"]
# DW-070: OpenAPI response validation. When enabled, the gateway
# validates upstream responses against the OpenAPI spec's response
# schemas and flags drift (optionally returning 502). Default OFF:
# jsonschema adds binary size. Build with
# `cargo build --features openapi_validation`.
openapi_validation = ["dep:jsonschema"]
# DW-064: Kubernetes Gateway API translator + controller. When enabled,
# the gateway can translate Gateway API v1 resources (Gateway, HTTPRoute,
# GatewayClass) and Ingress resources into its config model, and run a
# kube-rs controller that watches the API server and reconciles them into
# a dwara config. Default OFF: kube-rs + k8s-openapi add significant
# binary size. Build with `cargo build --features k8s`.
k8s = ["dep:kube", "dep:k8s-openapi"]
# DW-061: API aggregation plugin pack. When enabled, the gateway can
# compose responses from multiple upstreams (KrakenD-style) with
# JSONPath fragment shaping and per-fragment fail-open/closed.
# Default OFF: aggregation buffers bodies (explicit size caps), which
# is an extension cost, never a tax on the zero-buffering proxy path.
# Build with `cargo build --features aggregation`.
aggregation = []
# DW-112: Agent-operable administration via MCP. When enabled, the
# admin API is exposed as an MCP server with tools for route/service/
# policy CRUD, stats, and analytics queries. RBAC-scoped tool access
# -- AI agents operate dwara. Default OFF. Build with
# `cargo build --features mcp`.
mcp = []
# DW-083: Semantic caching (embedding-similarity cache for AI prompts).
# When enabled, the gateway can cache AI responses by prompt embedding
# similarity (paraphrased prompts hit the cache). Default OFF: hnsw_rs
# + its transitive deps (rayon, mmap-rs, anndists) add binary size.
# Build with `cargo build --features semantic_cache`.
semantic_cache = ["dep:hnsw_rs"]
# DW-088 / DW-108: HTTP/3 (QUIC) ingress AND upstream transport. On
# dwara-core this feature enables the QUIC stack (quinn, h3, h3-quinn)
# so the upstream connector (dataplane::upstream_h3) and the QUIC active
# health probe can compile, and so snapshot validation accepts
# `protocol: h3` listeners and upstreams. dwara-bin's `h3` feature
# forwards to this one (and adds its own deps for the H3 ingress
# listener). Default OFF: quinn+h3 add significant compile time and
# binary size. Build with `cargo build --features h3` (or
# `--features dwara-bin/h3`).
h3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]
# DW-114: A2A (agent-to-agent) protocol support. Flag-only feature
# (no new dependencies): the scaffold adapter, Agent Card parser, and
# config schema are hand-rolled (mirroring how MCP was done). The A2A
# task lifecycle is STUBBED pending spec freeze -- every task-state
# transition returns an A2AStub error. When the feature is off the
# `ai.a2a` config block is accepted but inert (validation warns).
# Build with `cargo build --features a2a`.
a2a = []
# DW-099: GraphQL awareness. When enabled, the gateway can enforce
# query depth/complexity limits and persisted-query enforcement on
# routes with a `graphql` block. Flag-only (no external dependency):
# depth/complexity are computed by a bounded hand-rolled scanner, not a
# full GraphQL parser crate, so no new dependency is introduced. Default
# OFF. Build with `cargo build --features graphql`.
graphql = []
# DW-111: FIPS 140-3 mode (Enterprise). Flag-only feature (no new
# dependencies): aws-lc-rs is already the default rustls crypto
# provider, so the FIPS-validated code path is present in every build.
# When this feature is ON, the gateway installs the aws-lc-rs FIPS
# provider as the process-default at startup, runs a self-test,
# restricts TLS cipher suites to the FIPS-approved allowlist, rejects
# non-approved primitives (Ed25519 certs, Argon2 credential hashing)
# at config validation, and asserts FIPS mode is active for licenses
# that require it. Ent-only: the feature compiles in OSS builds but is
# only meaningful with `ent` (license-gated enforcement). Build with
# `cargo build --features fips` (combine with `ent` for full effect).
fips = []
# DW-101: gRPC-Web + JSON-to-gRPC transcoding. When enabled, the gateway
# can translate gRPC-Web framing (content-type + chunk headers +
# trailers-as-headers) to native gRPC for upstreams, and transcode JSON
# request/response bodies to/from protobuf using .proto descriptors
# supplied via config (google.api.http annotations). gRPC status codes
# are mapped to HTTP status + google.rpc.Status JSON. Streaming
# (server-streaming and bidi) is supported at day one via chunked
# gRPC-Web framing. prost is the protobuf codec (already a workspace
# dep, MIT OR Apache-2.0). Default OFF. Build with
# `cargo build --features grpc_web`.
grpc_web = ["dep:prost"]
# DW-100: Full protocol translation framework. When enabled, the
# gateway can translate between REST, gRPC, and GraphQL on a route's
# forward and response paths via the shared `ProtocolTranslator` trait.
# The general framework (`dataplane::translation`) and the REST<->GraphQL
# translator (`dataplane::translation_graphql`) compile under this flag.
# It depends on `grpc_web` because the REST<->gRPC translator reuses the
# DW-101 gRPC-Web transcoding engine (the shared trait + the protobuf
# codec live behind `grpc_web`), so the two features ship together.
# Default OFF. Build with `cargo build --features protocol_translation`.
protocol_translation = ["grpc_web"]
# DW-100: SOAP/XML protocol translation. When enabled, the gateway can
# translate between REST/JSON and SOAP/XML envelopes on a route's
# forward and response paths via the `SoapTranslator` (a minimal
# hand-rolled XML parser handles SOAP envelopes -- no external XML
# crate, to avoid deny.toml review and binary size). Behind a separate
# flag from `protocol_translation` because the XML parser + SOAP
# envelope handling add binary size an operator who only needs
# REST<->GraphQL or REST<->gRPC should not pay. Default OFF. Build with
# `cargo build --features soap` (implies `protocol_translation`).
soap = ["protocol_translation"]
# DW-105: Post-quantum TLS (X25519+ML-KEM hybrid key exchange).
# EXPERIMENTAL. Flag-only feature (no new dependencies): the rustls PQ
# API for wiring the X25519+ML-KEM hybrid key-exchange group is
# experimental and not yet stable. When this feature is ON, a listener
# or upstream with `pq: true` prepends the hybrid kx group to the
# rustls provider's kx group list (preferring the hybrid group while
# keeping the classical X25519 fallback for non-PQ clients). When the
# feature is OFF, `pq: true` in config is accepted but inert
# (validation warns). Default OFF. Build with
# `cargo build --features pq`. Must NOT be combined with FIPS mode
# (validation rejects `pq: true` + `fips` unless both algorithms are
# on a validated list).
pq = []
# DW-103: L4 TCP/UDP proxying with SNI routing reuse. Flag-only feature
# (no new dependencies): the L4 dispatcher accepts a raw TCP connection,
# optionally peeks the TLS ClientHello SNI (reusing the SNI extraction
# from DW-008 TLS passthrough) to select the upstream, then splices the
# client and upstream connections byte-for-byte (the same
# copy_bidirectional tunnel the passthrough path uses). UDP proxying is
# STUBBED (returns Unimplemented) -- UDP is harder to get right
# (session semantics, NAT timeouts) and is a follow-up. The config
# schema (ListenerProtocol::Tcp/Udp + the `l4` block) is always present
# so configs round-trip without the feature; when the feature is off the
# listener is accepted but inert (validation warns). Default OFF. Build
# with `cargo build --features l4` (or `--features dwara-bin/l4`).
l4 = []
# DW-107: Service mesh mode (sidecar + SPIFFE/SPIRE mTLS identity).
# Flag-only feature (no new dependencies): the sidecar controller
# scaffold, the SPIFFE Workload API client scaffold, and the `mesh`
# config block are hand-rolled. The actual iptables/tproxy redirect
# configuration and the SPIRE Workload API calls are STUBBED (documented
# no-ops) -- the `spiffe` crate would be added when production-ready.
# Ent-only: the feature compiles in OSS builds but is only meaningful
# with `ent` (validation warns when mesh is configured without the
# `ent` feature, mirroring the FIPS/credential-pool ent-gate pattern).
# Build with `cargo build --features mesh` (combine with `ent` for
# license-gated enforcement).
mesh = []
# DW-110: API lifecycle management. Flag-only feature (no new
# dependencies): the developer portal (auto-generated from OpenAPI
# specs), environment profiles (dev/staging/prod config overlays), and
# the API journey recorder (request flow visualization for debugging)
# are hand-rolled over the existing OpenAPI spec handling, config
# schema, and analytics raw table. The config schema (the top-level
# `lifecycle` block) is always present so configs round-trip without
# the feature; when the feature is off the block is accepted but inert
# (validation warns). Default OFF. Build with
# `cargo build --features api_lifecycle`.
api_lifecycle = []
# DW-109: Extism PDK plugin runtime. Flag-only scaffold (no new
# dependencies): the ExtismHost/ExtismPlugin types and the
# ExtismDispatch trait are hand-rolled so Extism plugins can be
# registered alongside native and WASM plugins in the unified dispatch
# chain. The actual `extism` crate would be added when the integration
# is production-ready; the runtime calls are STUBBED (documented
# no-ops). The config schema (the `extism` field on PluginConfig) is
# always present so configs round-trip without the feature; when the
# feature is off the block is accepted but inert (validation warns).
# Default OFF. Build with `cargo build --features extism`.
extism = []
# DW-109: Upstream TLS certificate pinning (SPKI hash). Flag-only
# feature (no new dependencies): the CertPin/CertPinVerifier types and
# the `cert_pinning` config block on upstreams are hand-rolled. The
# actual rustls custom certificate verifier integration is scaffolded
# (the verifier computes SHA-256 of the upstream cert's SPKI and
# compares against the configured pin). The config schema is always
# present so configs round-trip without the feature; when the feature
# is off the block is accepted but inert (validation warns). Default
# OFF. Build with `cargo build --features cert_pinning`.
cert_pinning = []
# DW-109: Signed URL request authentication. Flag-only feature (no new
# dependencies): the SignedUrlConfig/SignedUrlVerifier types and the
# `signed_url` config block on routes are hand-rolled. The verifier
# extracts the signature from the query string, recomputes the
# HMAC-SHA256 over the canonical request (method, path, expires
# timestamp), and checks the expiry. The config schema is always
# present so configs round-trip without the feature; when the feature
# is off the block is accepted but inert (validation warns). Default
# OFF. Build with `cargo build --features signed_url`.
signed_url = []

[dev-dependencies]
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
# The DW-027 compression round-trip tests use flate2/brotli/zstd as
# decoders; they are regular [dependencies] of this crate, and test
# targets link against those too, so they are deliberately NOT repeated
# here.
serde_json = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true }
# Micro-benchmarks (DW-024): criterion is dev/bench-only; it never ships in
# the gateway binary or library builds.
criterion = { workspace = true }
# DW-050 tests: generate .mmdb fixtures at runtime (dev-only;
# Apache-2.0 OR MIT).
mmdb-writer = { workspace = true }
# DW-042 tests: in-process DNS authority/server for deterministic
# discovery tests. MIT OR Apache-2.0. Dev-only.
hickory-server = { workspace = true }
# DW-055 tests: WAT (WebAssembly Text) parser for compiling test
# proxy-wasm modules from source at test time. Apache-2.0 WITH
# LLVM-exception (allow-listed in deny.toml). Dev-only.
wast = "258"

[[bench]]
name = "micro"
harness = false

# DW-058: CEL engine benchmark. Feature-gated behind `cel` — the bench
# file uses `#![cfg(feature = "cel")]` so it compiles to an empty binary
# without the feature.
[[bench]]
name = "cel"
harness = false
required-features = ["cel"]
