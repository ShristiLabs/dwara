# name: criteria-miss-falls-through
# The exact route wins path resolution but fails the method criterion;
# the router falls through to the prefix fallback (DP-06, #254). The
# GET /report request is now routed to catch-report instead of 404.
routes:
  - name: exact-post-only
    service: svc
    match:
      path: {type: exact, value: /report}
      methods: [POST]
    action: {type: proxy}
  - name: catch-report
    service: svc
    match: {path: {type: prefix, value: /report}}
    action: {type: proxy}
request: {method: GET, path: /report}
expect: {route: catch-report}
