# Category 02: Load Balancing & Upstream Management.
#
# Five load-balancer strategies (round-robin, least-requests, IP-hash,
# peak-EWMA, sticky sessions) plus a weighted traffic split and a
# DNS-discovery pool, each exposed on its own /lb/<strategy>/ prefix.
# No auth is required so the test scripts can exercise the pools with
# a plain curl.
#
# Upstream endpoints use docker service names (echo-a, echo-b, echo-c,
# slow) as addresses; the compose network resolves them. The dns-pool
# upstream has NO static endpoints at all — its endpoint set is
# populated live by DNS discovery (hostname: echo-dns).

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

listeners:
  - name: edge-http
    address: 0.0.0.0
    port: 8080
    protocol: http

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------

routes:
  - name: lb-round-robin
    service: rr-service
    match:
      path:
        type: prefix
        value: /lb/rr/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  - name: lb-least-requests
    service: lr-service
    match:
      path:
        type: prefix
        value: /lb/lr/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  - name: lb-ip-hash
    service: ip-hash-service
    match:
      path:
        type: prefix
        value: /lb/hash/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  - name: lb-peak-ewma
    service: ewma-service
    match:
      path:
        type: prefix
        value: /lb/ewma/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  - name: lb-sticky
    service: sticky-service
    match:
      path:
        type: prefix
        value: /lb/sticky/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  - name: lb-traffic-split
    service: split-service
    match:
      path:
        type: prefix
        value: /lb/split/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  # DNS discovery: /lb/dns/ traffic reaches the echo-dns instance ONLY
  # through the discovery-resolved endpoint set (the upstream below
  # has no static endpoints).
  - name: lb-dynamic-discovery
    service: dns-service
    match:
      path:
        type: prefix
        value: /lb/dns/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:
  - name: rr-service
    upstream: rr-pool

  - name: lr-service
    upstream: lr-pool

  - name: ip-hash-service
    upstream: ip-hash-pool

  - name: ewma-service
    upstream: ewma-pool

  - name: sticky-service
    upstream: sticky-pool
    sticky:
      cookie: dwara-affinity
      ttl_s: 3600

  - name: split-service
    split:
      targets:
        - upstream: rr-pool
          weight: 90
        - upstream: lr-pool
          weight: 10

  - name: dns-service
    upstream: dns-pool

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------

upstreams:
  # Round-robin pool: equal-weight echo-a/b/c.
  - name: rr-pool
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: echo-a
        port: 8080
        weight: 1
      - address: echo-b
        port: 8080
        weight: 1
      - address: echo-c
        port: 8080
        weight: 1

  # Least-requests pool: equal-weight echo-a/b/c.
  - name: lr-pool
    load_balancer: least_requests
    protocol: http1
    endpoints:
      - address: echo-a
        port: 8080
        weight: 1
      - address: echo-b
        port: 8080
        weight: 1
      - address: echo-c
        port: 8080
        weight: 1

  # IP-hash pool: equal-weight echo-a/b/c. Same client IP maps to the
  # same endpoint, so a single-source test sees one instance.
  - name: ip-hash-pool
    load_balancer: ip_hash
    protocol: http1
    endpoints:
      - address: echo-a
        port: 8080
        weight: 1
      - address: echo-b
        port: 8080
        weight: 1
      - address: echo-c
        port: 8080
        weight: 1

  # Peak-EWMA pool: echo-a (fast) and slow (adds ~200ms delay). The
  # latency-aware balancer should skew traffic toward echo-a.
  - name: ewma-pool
    load_balancer: peak_ewma
    protocol: http1
    endpoints:
      - address: echo-a
        port: 8080
        weight: 1
      - address: slow
        port: 8080
        weight: 1
    peak_ewma:
      decay_ms: 10000
      default_rtt_ms: 250

  # Sticky-session pool: echo-a and echo-b. The sticky-service attaches
  # a dwara-affinity cookie so repeat requests from the same client
  # pin to the same endpoint.
  - name: sticky-pool
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: echo-a
        port: 8080
        weight: 1
      - address: echo-b
        port: 8080
        weight: 1

  # DNS-discovery pool (DW-042): NO static endpoints. A background
  # task resolves `echo-dns` (the compose service name, answered by
  # docker's embedded DNS) every refresh_interval_s and hot-swaps the
  # resolved A records into the balancer's endpoint set. The resolver
  # reads the container's /etc/resolv.conf, so cluster-local names
  # resolve. fail_open keeps the last set on DNS failure;
  # min_endpoints floors the set at 1. A single A record is fine here
  # (docker DNS answers one address per service) — the assertion the
  # demo makes is that discovery RESOLVES and ROUTES, not that it
  # fans out.
  - name: dns-pool
    load_balancer: round_robin
    protocol: http1
    endpoints: []
    dns_discovery:
      hostname: echo-dns
      port: 8080
      refresh_interval_s: 5
      record_type: A
      fail_open: true
      min_endpoints: 1
