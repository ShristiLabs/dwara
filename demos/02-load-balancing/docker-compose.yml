# Category 02: Load Balancing & Upstream Management.
#
# Starts the dwara gateway plus three echo upstreams (echo-a/b/c), one
# slow upstream, and wires them into five load-balancer pools and one
# traffic-split service. All services share a single docker network so
# the gateway can reach upstreams by service name.
#
#   docker compose up -d
#   ./test-01-round-robin.sh
#
# The gateway image is built from the repo-root Dockerfile.scratch
# (static musl binary on FROM scratch). Scratch has no users, so the
# service injects the nonroot UID 65532 via `user:` (same UID the
# distroless variant bakes in).
services:
  dwara:
    image: dwara:demo
    build:
      context: ../..
      dockerfile: Dockerfile.scratch
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      - "8080:8080"
    depends_on:
      - echo-a
      - echo-b
      - echo-c
      - slow
    networks:
      - lb-net

  echo-a:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo-a
    networks:
      - lb-net

  echo-b:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo-b
    networks:
      - lb-net

  echo-c:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo-c
    networks:
      - lb-net

  slow:
    image: dwara-demo/slow
    environment:
      INSTANCE_NAME: slow
    networks:
      - lb-net

networks:
  lb-net:
    driver: bridge
