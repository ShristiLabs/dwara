# Category 07 (real LLMs): AI Gateway.
#
# Starts the dwara gateway (HTTP on :8080). The gateway forwards to
# three real OpenAI-compatible LLM backends:
#
#   - z.ai (GLM-5.3)        direct HTTPS to api.z.ai:443 (path override)
#   - Ollama (llama3.2)     via host.docker.internal:11434
#   - LM Studio             via host.docker.internal:1234
#
# Prerequisites:
#   - ZAI_API_KEY env var exported before `docker compose up -d`
#   - Ollama running on the host (ollama serve) with llama3.2 pulled
#   - LM Studio running on the host with a model loaded and the
#     OpenAI-compatible server started (Developer tab, default :1234)
#   - Gateway image built: docker build -f Dockerfile.scratch -t dwara:demo .
#   - Certs present: demos/_shared/certs/server.crt etc.
#
#   docker compose up -d
#   ./test-01-provider-adapters.sh   # (and the other test-*.sh scripts)
#
# The gateway image (dwara:demo) is a static musl binary on FROM scratch.
# Scratch has no users, so the service injects the nonroot UID 65532 via
# `user:` (same UID the distroless variant bakes in).
#
# Networking: the gateway's async DNS resolver (hickory) reads /etc/hosts
# but does NOT query Docker's embedded DNS (127.0.0.11). host.docker.internal
# is seeded via extra_hosts (Docker Desktop adds it to /etc/hosts, but
# extra_hosts guarantees it on all platforms). Public domains like
# api.z.ai resolve through the system DNS resolver normally.
services:
  dwara:
    image: dwara:demo
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
      # z.ai API key (read by the gateway at config-compile time to
      # resolve the ${ZAI_API_KEY} reference in the ai.providers auth).
      # Must include the "Bearer " prefix because the credential resolver
      # requires ${...} to be the ENTIRE config value (not "Bearer ${...}").
      ZAI_API_KEY: 'Bearer ${ZAI_API_KEY}'
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      # Plaintext HTTP entry point (all demo test scripts hit this).
      - "8080:8080"
      # mTLS-only admin API (prompt-logs / governance-audit queries).
      - "2019:2019"
    # Seed /etc/hosts so the gateway's hickory resolver can resolve the
    # host without querying Docker's embedded DNS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      ai-real-net:
        ipv4_address: 172.29.0.2

networks:
  ai-real-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
