# Category 04: Security & Authentication.
#
# Starts the dwara gateway with two listeners (HTTP on 8080 and HTTPS on
# 8443 with TLS terminate + mTLS client-cert verification), an echo upstream,
# and the mTLS-only admin API on 2019. All services share a single docker
# network so the gateway can reach the echo upstream by service name.
#
#   docker compose up -d
#   ./test-01-api-key-auth.sh
#
# The gateway image is built from the repo-root Dockerfile.scratch
# (static musl binary on FROM scratch). Scratch has no users, so the
# service injects the nonroot UID 65532 via `user:` (same UID the
# distroless variant bakes in).
services:
  dwara:
    image: dwara:demo
    build:
      context: ../..
      dockerfile: Dockerfile.scratch
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      - "8080:8080"
      - "8443:8443"
      - "2019:2019"
    depends_on:
      - echo
    networks:
      - sec-net

  echo:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo
    networks:
      - sec-net

networks:
  sec-net:
    driver: bridge
