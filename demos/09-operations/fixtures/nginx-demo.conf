# Sample NGINX config for test-11-config-import.sh.
#
# Input for `dwara-cli import nginx`: the importer parses `server`
# blocks (listen/server_name), `location` blocks with `proxy_pass`,
# and `upstream` blocks with `server` endpoints. Unsupported
# constructs (rewrite, auth_basic, limit_req, if, try_files, ...) are
# reported as warnings appended to the generated Dwara YAML as
# comments.
#
# What this file exercises:
# - an `upstream backend` block with TWO server endpoints
#   -> becomes dwara upstream `backend-upstream` (round_robin) and
#      service `backend-service`;
# - a prefix location `/api/` with `proxy_pass http://backend`
#   -> route-0, prefix match /api/, service backend-service;
# - an exact location `= /exact` with a literal `proxy_pass`
#   -> route-1, exact match /exact, service route-1-service (a
#      synthesized upstream from the proxy_pass host:port);
# - a prefix location `/legacy/` that also uses an unsupported
#   `rewrite` directive -> route-2 plus an import warning.
upstream backend {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 8080;
    server_name demo.local;

    location /api/ {
        proxy_pass http://backend;
    }

    location = /exact {
        proxy_pass http://127.0.0.1:9000;
    }

    location /legacy/ {
        rewrite ^/legacy/(.*)$ /$1 break;
        proxy_pass http://backend;
    }
}
