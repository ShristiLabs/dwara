# HTTPRoute for test-12-kubernetes-gateway-api.sh.
#
# Attaches to the demo-gateway Gateway (data/gateway.yaml) and routes
# two path prefixes to Kubernetes Service backends. The dwara
# translator maps each rule match to a dwara route and each backendRef
# to a service/upstream/endpoint triple (crates/dwara-core/src/
# k8s_gateway/mod.rs). Path match types supported: Exact,
# PathPrefix, RegularExpression.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route
  namespace: dwara-demo
spec:
  parentRefs:
    - name: demo-gateway
      sectionName: http
  hostnames:
    - demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: static-service
          port: 80
