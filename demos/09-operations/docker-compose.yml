# Category 09: Operations & Config Management.
#
# Starts the dwara gateway with a plaintext HTTP listener on 8080, the
# mTLS-only admin API on 2019, plus two upstreams:
#   - echo   (dwara-demo/echo)   reflects the request as JSON
#   - static (dwara-demo/static) serves demo HTML + JSON files
# and an OpenTelemetry collector the gateway exports traces + metrics
# to over OTLP (test-04-otlp-export.sh):
#   - otel-collector (otel/opentelemetry-collector) receives on :4318
#
# All services share a single docker network so the gateway can
# reach the upstreams (and the collector) by service name. The gateway
# config is mounted read-only at /etc/dwara/dwara.yaml; the shared
# certs (server/client CA + client cert for the admin API's mTLS) are
# mounted from ../_shared/certs. A local ./data directory backs the
# SQLite state DB so consumer/credential seeding survives restarts.
#
#   docker compose up -d
#   ./test-01-hot-reload.sh   (and the other test-NN-*.sh scripts)
#
# The gateway image is the prebuilt `dwara:demo` (FROM scratch, static
# musl binary). Scratch has no users, so the service injects the
# nonroot UID 65532 via `user:` (same UID the distroless variant bakes
# in). The admin API is mTLS-only: every call needs a client cert
# chained to the client CA (see test-02-admin-api.sh).
services:
  dwara:
    image: dwara:demo
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
      # Secret resolved at config-compile time via the ${ENV_NAME}
      # grammar (DW-045). Unset/empty fails closed, so the gateway
      # refuses to start without it. See test-08-secrets.sh.
      DEMO_SECRET: ops-secret-key-123
      # OTLP export (#126 / DW-073): one BASE endpoint, two signals —
      # the trace exporter appends /v1/traces and the periodic metrics
      # exporter appends /v1/metrics. Unset = inert. The interval
      # override shortens the default 15s so the demo test observes an
      # export quickly. See test-04-otlp-export.sh.
      DWARA_OTLP_ENDPOINT: http://otel-collector:4318
      DWARA_OTLP_METRICS_INTERVAL_SECS: "2"
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      - "8080:8080"
      - "2019:2019"
    depends_on:
      - echo
      - static
      - otel-collector
    networks:
      - ops-net

  echo:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo
      PORT: "8080"
    networks:
      - ops-net

  static:
    image: dwara-demo/static
    networks:
      - ops-net

  # OTLP receiver for the gateway's trace + metrics export (test-04).
  # Pinned to 0.96.0: that release still ships the `logging` exporter
  # (renamed to `debug` in later versions), which is what the demo's
  # collector config uses. No host ports are published — only the
  # gateway (on ops-net) talks to it.
  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./fixtures/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - ops-net

networks:
  ops-net:
    driver: bridge
