# Demo 01 wiring: user-subset migration to a new API version.
#
# The test script copies this file VERBATIM into a scratch directory
# and runs the gateway against it (cwd at the repository root). The
# include path is relative to this file's directory, so the scratch
# copy picks up its own generated include:
#
#   plugins-config/v2-migrator.yaml   <- GENERATED by services/publish.sh
#
# which carries the whole `plugins:` block, allow-list and all. The
# deliberate split: the main config is the hand-written topology; the
# include is machine-written publisher output. Routes:
#
# - user-api    /v1/*  + the v2-migrator plugin (rewrites /v1/ ->
#   /v2/ for allowed users; the mock user API serves both endpoints)
# - public-echo /public/* with NO plugin (the control route: its path
#   must never be rewritten, before and after every reload)
# - healthz     readiness responder

listeners:
  - name: migration-http
    address: 127.0.0.1
    port: 18201
    protocol: http

includes:
  - plugins-config/v2-migrator.yaml

routes:
  - name: user-api
    service: user-api-service
    match:
      path:
        type: prefix
        value: /v1/
    action:
      type: proxy
    auth_required: false
    plugins:
      - v2-migrator

  - name: public-echo
    service: user-api-service
    match:
      path:
        type: prefix
        value: /public/
    action:
      type: proxy
    auth_required: false

  - name: healthz
    service: user-api-service
    match:
      path:
        type: exact
        value: /healthz
    action:
      type: respond
      status: 200
      body: ok
    auth_required: false

services:
  - name: user-api-service
    upstream: user-api-upstream

upstreams:
  - name: user-api-upstream
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: 127.0.0.1
        port: 18202
