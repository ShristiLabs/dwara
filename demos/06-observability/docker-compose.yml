# Category 06: Observability & Analytics
#
# Starts the dwara gateway (HTTP on 8080) with the mTLS-only admin API
# on 2019, an echo upstream, and a webhook-receiver that collects event
# webhooks and analytics-stream batches. All services share a single
# docker network so the gateway can reach the upstreams by service name.
#
# This demo exercises the full observability stack: the Prometheus
# /metrics endpoint, request-id propagation, structured access logs
# (docker logs), the embedded analytics store (queried over the mTLS
# admin API), custom request-header dimensions, live sketches, ML
# traffic insights, scheduled exports, the real-time analytics stream
# (NDJSON firehose to the webhook receiver), and alert/event webhooks.
#
#   docker compose up -d
#   ./test-01-metrics.sh        (and the other test-NN-*.sh scripts)
#
# The gateway image is the prebuilt `dwara:demo` (FROM scratch, static
# musl binary). Scratch has no users, so the service injects the
# nonroot UID 65532 via `user:`. The HTTP listener is plaintext on
# :8080 for simplicity; the admin API on :2019 requires mTLS.
services:
  dwara:
    image: dwara:demo
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      - "8080:8080"
      - "2019:2019"
    depends_on:
      - echo
      - webhook-receiver
    networks:
      - obs-net

  echo:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo
      PORT: "8080"
    networks:
      - obs-net

  webhook-receiver:
    image: dwara-demo/webhook-receiver
    environment:
      PORT: "8080"
    # Exposed on 8081 so the host-side test scripts can query the
    # received event ledger (GET /events). The gateway reaches it
    # internally on obs-net as webhook-receiver:8080.
    ports:
      - "8081:8080"
    networks:
      - obs-net

networks:
  obs-net:
    driver: bridge
