# Category 08: Extensibility
#
# Starts the dwara gateway with a plaintext HTTP listener on 8080, the
# mTLS-only admin API on 2019, plus two upstreams:
#   - echo   (dwara-demo/echo)   reflects the request as JSON
#   - static (dwara-demo/static) serves demo HTML + JSON files
#
# All three services share a single docker network so the gateway can
# reach the upstreams by service name. The gateway config is mounted
# read-only at /etc/dwara/dwara.yaml; the shared certs (server/client
# CA + client cert for the admin API's mTLS) are mounted from
# ../_shared/certs. A local ./data directory backs the SQLite state DB.
#
#   docker compose up -d
#   ./test-01-native-plugins.sh   (and the other test-NN-*.sh scripts)
#
# The gateway image is the prebuilt `dwara:demo` (FROM scratch, static
# musl binary). Scratch has no users, so the service injects the
# nonroot UID 65532 via `user:`. The admin API is mTLS-only: every
# call needs a client cert chained to the client CA.
#
# Extensibility note: the default `dwara:demo` image is built WITHOUT
# the `plugins`, `wasm`, `nano_services`, and `cel` cargo features
# (they are default OFF to keep the binary within the 25MB budget).
# The config schema ACCEPTS the `plugins` top-level block and the
# `nano_service` route action, but they are inert without the features
# compiled in. This demo documents the extensibility surface and
# verifies the gateway still starts and proxies correctly with the
# default build. See README.md for how to build a feature-enabled image.
services:
  dwara:
    image: dwara:demo
    user: "65532:65532"
    environment:
      DWARA_CONFIG: /etc/dwara/dwara.yaml
      DWARA_STATE_DB: /var/lib/dwara/state.db
    volumes:
      - ./dwara.yaml:/etc/dwara/dwara.yaml:ro
      - ../_shared/certs:/etc/dwara/certs:ro
      - ./data:/var/lib/dwara
    ports:
      - "8080:8080"
      - "2019:2019"
    depends_on:
      - echo
      - static
    networks:
      - ext-net

  echo:
    image: dwara-demo/echo
    environment:
      INSTANCE_NAME: echo
      PORT: "8080"
    networks:
      - ext-net

  static:
    image: dwara-demo/static
    networks:
      - ext-net

networks:
  ext-net:
    driver: bridge
