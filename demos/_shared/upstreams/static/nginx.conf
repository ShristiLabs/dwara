server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /healthz {
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store";
    }
}
