# cargo-deny configuration. Advisories, licenses, and bans are enforced
# in CI; a failure blocks the pipeline.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # notify (config file watcher) is CC0-1.0: public-domain dedication,
  # acceptable as a dependency license; dwara's own code is Apache-2.0.
  "CC0-1.0",
  # webpki-roots (upstream TLS trust store, DW-008) ships the Mozilla root
  # set under CDLA-Permissive-2.0: permissive data license, not code copyleft.
  "CDLA-Permissive-2.0",
  # foldhash (hasher pulled in by governor's keyed state, DW-017) is
  # Zlib-licensed: short permissive MIT-style license, not copyleft.
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Path-only deps to workspace crates would trip a "deny" wildcard gate
# for publishable crates (crates.io disallows bare path deps); kept as a
# warning instead of forcing version pins in crates/*/Cargo.toml.
wildcards = "warn"
