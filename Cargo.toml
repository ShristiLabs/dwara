[workspace]
resolver = "2"
members = [
    "crates/dwara-core",
    "crates/dwara-bin",
    "crates/dwara-admin",
    "crates/dwara-cli",
    "crates/dwara-console",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
# #126: direct dependency for the otlp feature's std-only exporter HTTP
# client (http::Request/Response types behind the opentelemetry-http
# HttpClient trait); already in the tree via hyper, so this only makes it
# a direct one. MIT OR Apache-2.0.
http = "1"
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "server-graceful", "http1", "http2", "server-auto"] }
# PROXY protocol v1/v2 header parsing (DW-030): ppp is Apache-2.0 (a lone
# license expression, allow-listed in deny.toml). Used strictly as a parser
# over already-buffered bytes; the async framing read, bounds, and the
# fail-closed policy live in dwara-core's dataplane::proxy_proto.
ppp = "2.3"
# GeoIP database READER (DW-050): maxminddb is Apache-2.0 OR MIT
# (allow-listed). The writer below is DEV-ONLY (tests generate their
# own .mmdb fixtures — no binary test data committed to the repo).
maxminddb = "0.30"
mmdb-writer = "0.1.0"
http-body-util = "0.1"
bytes = "1"
# hyper-util's legacy client is generic over tower Service connectors.
tower-service = "0.3"
# Upstream TLS verification (DW-008): Mozilla webpki root set — small,
# deterministic, no OS variance in tests; system roots can follow later.
webpki-roots = "0.26"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
serde_json = "1"
async-trait = "0.1"
arc-swap = "1"
matchit = "0.9"
regex = "1"
notify = "8"
# TLS stack (DW-007): rustls with the aws-lc-rs provider (builds C via
# cmake/cc); tokio-rustls for async accept/connect. PEM loading uses
# rustls-pki-types PemObject directly (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134); rcgen (dev-only) generates test certificates.
# #120: default-features = false trims rustls's default set down to exactly
# what the gateway uses (at 0.23.43 the operative drop is the
# prefer-post-quantum default suite tweak); the ring provider feature is
# not enabled anywhere in the workspace (ring the crate only appears via
# rcgen/jsonwebtoken). Mirrors the tokio-rustls declaration below.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws-lc-rs"] }
# #121 validation-time PEM check: snapshot::validate parses trusted_ca_file
# bundles with rustls-pki-types' PemObject (the same substrate rustls and
# security/tls.rs use; already in the tree as a rustls dependency, so this
# only makes it a direct one). License Apache-2.0 OR MIT (both allow-listed
# in deny.toml).
rustls-pki-types = "1"
# Key-material hygiene (#120): Zeroizing wrappers wipe PEM/DER private-key
# buffers on drop. License Apache-2.0 OR MIT (the Apache-2.0 branch is
# allow-listed in deny.toml); already in the tree as a rustls /
# rustls-pki-types dependency, so this only makes it a direct one.
zeroize = "1"
rcgen = "0.13"
# Property-based tests (DW-011 balancer coverage): Apache-2.0/MIT.
# GCRA rate limiting (DW-017): MIT. Runs on governor's default features
# (the GCRA math and the quanta clock); the keyed state store is our own
# sharded, size-capped implementation (extensions/rate_limiter.rs,
# #122) — governor's dashmap-backed store, though pulled in by its
# defaults, is no longer used.
governor = { version = "0.10" }
proptest = "1"
# SQLite state store (DW-018): rusqlite is MIT; the "bundled" feature
# compiles the bundled SQLite (public domain, libsqlite3-sys is MIT) so no
# system libsqlite3 is required at build or deploy time.
# Bumped 0.37 -> 0.38 (DW-115): rusqlite_migration 2.4 — the nearest
# release supporting our pinned rustc 1.94 — requires rusqlite ^0.38.
# The 0.37 -> 0.38 step is additive for the APIs this workspace uses.
rusqlite = { version = "0.38", features = ["bundled"] }
# Versioned SQLite schema migrations (DW-115): rusqlite_migration is
# MIT OR Apache-2.0. Pinned to 2.4 because 2.5 pulls rusqlite 0.39 and
# 2.6 requires rustc 1.95; the workspace pins 1.94. Applies migrations
# transactionally and tracks state in PRAGMA user_version (matching the
# DW-018 hand-rolled baseline).
rusqlite_migration = "2.4"
# Tempfile-backed on-disk store tests (DW-018 dev-only): MIT/Apache-2.0.
tempfile = "3"
# Authentication (DW-019): all MIT OR Apache-2.0. subtle is the standard
# constant-time comparison primitive; sha2 is the fast API-key hash path
# (hash-at-rest + hash-selector lookups); argon2 verifies OPTIONAL
# memory-hard PHC-format credential hashes (admin-supplied via the store —
# per-lookup argon2 is slow, so config-seeded keys hash with sha256);
# base64 decodes Basic credentials; jsonwebtoken verifies Bearer tokens
# against JWKS keys (RS/ES/Ed; its ring backend is already in the tree
# via rcgen). hmac (#124) peppers the stored fast-path hashes with a
# per-deployment secret (sha2 alone cannot HMAC); RustCrypto, MIT OR
# Apache-2.0, only `digest` beneath it (already in the tree).
subtle = "2"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
base64 = "0.22"
jsonwebtoken = "9"
# DW-032: chrono for license expiry/grace-period arithmetic (ent feature
# only, but declared as a regular dep so the licensing module compiles
# cleanly under both feature sets). MIT OR Apache-2.0 (both allow-listed);
# already in the tree via jsonwebtoken and (with ent) licensing-core.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Observability (DW-021): all MIT. tracing provides the span/event
# substrate used across dwara-core; tracing-subscriber (binary/dev only)
# renders JSON logs with env filtering; prometheus with default features
# OFF keeps the protobuf exporter out of the tree (text format only).
tracing = "0.1"
# Local response cache (DW-037): moka is MIT OR Apache-2.0 (both
# allow-listed in deny.toml), pure Rust with no C. Only the `sync`
# cache is used (no future runtime, no quanta clock); `atomic64`
# keeps moka's own default of 64-bit atomics on our 64-bit targets.
# Consumed via the CacheStore extension seam (extensions/cache.rs)
# with a byte weigher + per-entry TTL, so eviction/freshness memory
# stays bounded.
moka = { version = "0.12", default-features = false, features = ["sync", "atomic64"] }
# Response compression codecs (DW-027): flate2 is MIT OR Apache-2.0
# (rust_backend = pure-Rust miniz_oxide, no C); brotli is MIT (pure
# Rust); zstd is MIT (zstd-sys binds the C libzstd, the same build
# profile as rusqlite's bundled SQLite and aws-lc-rs). All three are
# Write-based streaming encoders driven chunk-by-chunk by the dataplane's
# compression wrapper — no whole-body buffering anywhere.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "8"
zstd = "0.13"
# OTLP trace + metrics export (#126, DW-073; default-off `otlp` feature
# on dwara-bin): the whole stack is feature-gated because it weighs on
# the musl release binary against the DW-026 25MB budget.
# opentelemetry-otlp carries ONLY http/protobuf (http-proto; no
# tonic/grpc transport, no reqwest client — dwara-bin ships a std-only
# exporter HTTP client, see its src/otlp.rs). tracing-opentelemetry is
# the era-appropriate span bridge: opentelemetry-appender-tracing has
# been logs-only since 0.28. All Apache-2.0 except
# tracing-opentelemetry (MIT).
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "metrics"] }
opentelemetry-proto = { version = "0.32", default-features = false }
tracing-opentelemetry = "0.33"
# DW-073: protobuf encoding for OTLP metrics export. Already in the tree
# transitively via opentelemetry-proto; this makes it a direct dep so
# the metrics encoder in otlp.rs can call Message::encode_to_vec. MIT OR
# Apache-2.0.
prost = "0.14"
# DW-055: proxy-wasm host runtime. wasmtime is the WebAssembly engine
# that runs proxy-wasm filters. Apache-2.0 WITH LLVM-exception (allow-
# listed in deny.toml). Feature-gated behind the `wasm` feature on
# dwara-core so the default build never pulls it in — wasmtime + its
# cranelift compiler are significant binary size against the DW-026
# 25MB budget. Version 47.0.3 is the latest stable patch (published
# 2026-07-31, well-vetted).
wasmtime = { version = "47", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "cache",
    "runtime",
] }
serial_test = "3"
# DW-058: CEL (Common Expression Language) engine. cel-interpreter
# provides parse, type-check, and interpret. MIT (allow-listed in
# deny.toml). Version 0.10.0 published 2025-07-23, well-vetted
# (354K downloads). Feature-gated behind the `cel` feature on
# dwara-core so the default build never pulls it in.
cel-interpreter = { version = "0.10", default-features = false }
# DW-060: Cedar policy engine. cedar-policy is AWS's Rust-native
# authorization policy language (Apache-2.0, allow-listed in
# deny.toml). Version 4.12.0 published 2026-07-28, well-vetted
# (8M downloads). Feature-gated behind the `cedar` feature on
# dwara-core so the default build never pulls it in.
cedar-policy = { version = "4.12", default-features = false }
# DW-070: OpenAPI response validation. jsonschema is a JSON Schema
# validator (MIT, allow-listed in deny.toml). Version 0.46.10
# published 2026-07-05, well-vetted (1.1M downloads). Feature-gated
# behind the `openapi_validation` feature on dwara-core.
jsonschema = { version = "0.46", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
prometheus = { version = "0.14", default-features = false }
# CLI argument parsing (DW-022): clap is MIT OR Apache-2.0; derive
# feature only to keep the dep tree small.
clap = { version = "4", features = ["derive", "env"] }
# Micro-benchmark harness (DW-024, dev/bench-only): MIT OR Apache-2.0.
# default-features = false drops plotters/rayon (reporting deps we do not
# use); cargo_bench_support keeps `--output-format bencher` for the
# regression gate in .github/workflows/bench.yml.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# DW-032: Enterprise licensing primitives (optional, ent feature only).
# licensing-core is BUSL-1.1 (allow-listed in deny.toml): the Business Source
# License allows non-production use and converts to Apache-2.0 after a change
# date. It is a private dependency consumed only when the `ent` cargo feature
# is enabled on dwara-core; OSS builds (the default) never pull it in. Declared
# directly in dwara-core's Cargo.toml (workspace deps cannot be optional). The
# canonical source is the private git repo; a path dependency is used in local
# development where the repo is checked out alongside dwara. CI fetches it via
# the LICENSING_TOKEN secret (fine-grained PAT with Contents:read on
# ShristiLabs/licensing) -- the automatic GITHUB_TOKEN cannot access other
# private repos.
licensing-core = { git = "https://github.com/ShristiLabs/licensing.git", rev = "62ce280" }
# DW-031: Redis client for the distributed rate limiter (ent feature only).
# redis is BSD-3-Clause (allow-listed in deny.toml). Optional so OSS builds
# (the default) never pull it in; enabled via the `ent` feature on dwara-core.
# The `tokio-comp` feature enables the async API (ConnectionManager) used by
# the distributed GCRA limiter.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# DW-042: DNS-based dynamic upstream discovery (hickory-resolver for
# TTL-aware A/SRV resolution). MIT OR Apache-2.0 (both allow-listed in
# deny.toml). The `tokio` feature enables the async TokioResolver
# used by the discovery background tasks; `system-config` is OFF so the
# resolver never reads /etc/resolv.conf — the gateway configures the
# name servers explicitly (system config is a follow-up if needed).
# Upgraded from 0.24 to 0.26 to fix RUSTSEC-2026-0119 (O(n^2) name
# compression DoS in hickory-proto).
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
# DW-042 tests: an in-process DNS authority/server for deterministic
# discovery tests (no external DNS dependency). MIT OR Apache-2.0.
# Dev/bench-only — never ships in the gateway binary or library.
hickory-server = { version = "0.26", default-features = false }
# DW-049 zero-downtime binary upgrade: socket2 sets SO_REUSEPORT on the
# listening sockets so a new process can bind the same port during the
# hand-off window (the kernel load-balances accepts across both). Already
# in the tree transitively via hyper-util/tokio; this only makes it a
# direct one. MIT OR Apache-2.0 (both allow-listed in deny.toml).
socket2 = "0.6"
# DW-049: libc sends SIGUSR2 to a running gateway from the `dwara upgrade`
# CLI subcommand (the operator-facing upgrade trigger). Already in the
# tree transitively; this only makes it a direct one. MIT OR Apache-2.0.
libc = "0.2"
# DW-064: Kubernetes Gateway API controller. kube-rs is the Rust client
# for Kubernetes (Apache-2.0, allow-listed in deny.toml). Feature-gated
# behind the `k8s` feature on dwara-core so the default build never pulls
# it in. Version 4.0.0 published 2026-06-16, well-vetted (831K downloads).
# The `runtime` feature enables watcher/Controller/reflector; `client`
# enables the API client; `derive` enables the CustomResource derive macro
# for Gateway API CRD types. k8s-openapi 0.28.0 is the matching version
# (Apache-2.0 OR MIT, both allow-listed); the `v1_32` feature pins a
# specific Kubernetes API version (NOT `latest`, so the build is
# reproducible). schemars 1 is already a workspace dep.
kube = { version = "4.0", default-features = false, features = [
    "runtime",
    "client",
    "derive",
] }
k8s-openapi = { version = "0.28", default-features = false }
# DW-066: gRPC transport for the CP/DP split (ent feature only). tonic is
# MIT (allow-listed in deny.toml). Feature-gated behind the `ent` feature
# on dwara-core so OSS builds never pull it in. Version 0.12.3 published
# 2025-02-07, well-vetted. default-features = false + ["transport",
# "codegen"] avoids pulling in tonic's prost 0.13 (we use the workspace
# prost 0.14 for hand-written messages via a custom Codec impl -- no
# protoc/build-script dependency). TLS is optional (tls-* features off by
# default); plaintext gRPC for the dev/test path, mTLS documented as
# follow-up.
tonic = { version = "0.12", default-features = false, features = [
    "transport",
    "codegen",
] }
# DW-066: tokio-stream for wrapping mpsc receivers as Stream items in the
# CP/DP gRPC server-streaming transport (ent feature only). Already pulled
# in transitively by tonic; this makes it a direct dep. MIT.
tokio-stream = { version = "0.1", features = ["net"] }
# DW-083: Semantic caching (embedding-similarity cache for AI prompts).
# hnsw_rs is a pure-Rust HNSW (Hierarchical Navigable Small World) ANN
# index. MIT OR Apache-2.0 (both allow-listed in deny.toml). Version
# 0.3.4 published 2026-02-28, well-vetted (515K downloads). Feature-gated
# behind the `semantic_cache` feature on dwara-core so the default build
# never pulls it in (rayon + mmap-rs + anndists add binary size).
hnsw_rs = { version = "0.3", default-features = false }

[profile.release]
lto = true
# DW-026 size bar: strip symbols from release binaries (the musl image
# lands well under 25 MB with this on; see quickstart/packaging notes).
# panic stays "unwind" — abort would change the gateway's error
# semantics (in-flight request failure vs process teardown).
strip = true
