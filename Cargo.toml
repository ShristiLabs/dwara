[workspace]
resolver = "2"
members = [
    "crates/dwara-core",
    "crates/dwara-bin",
    "crates/dwara-admin",
    "crates/dwara-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
# #126: direct dependency for the otlp feature's std-only exporter HTTP
# client (http::Request/Response types behind the opentelemetry-http
# HttpClient trait); already in the tree via hyper, so this only makes it
# a direct one. MIT OR Apache-2.0.
http = "1"
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "server-graceful", "http1", "http2", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
# hyper-util's legacy client is generic over tower Service connectors.
tower-service = "0.3"
# Upstream TLS verification (DW-008): Mozilla webpki root set — small,
# deterministic, no OS variance in tests; system roots can follow later.
webpki-roots = "0.26"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
serde_json = "1"
async-trait = "0.1"
arc-swap = "1"
matchit = "0.9"
regex = "1"
notify = "8"
# TLS stack (DW-007): rustls with the aws-lc-rs provider (builds C via
# cmake/cc); tokio-rustls for async accept/connect. PEM loading uses
# rustls-pki-types PemObject directly (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134); rcgen (dev-only) generates test certificates.
# #120: default-features = false trims rustls's default set down to exactly
# what the gateway uses (at 0.23.43 the operative drop is the
# prefer-post-quantum default suite tweak); the ring provider feature is
# not enabled anywhere in the workspace (ring the crate only appears via
# rcgen/jsonwebtoken). Mirrors the tokio-rustls declaration below.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws-lc-rs"] }
# #121 validation-time PEM check: snapshot::validate parses trusted_ca_file
# bundles with rustls-pki-types' PemObject (the same substrate rustls and
# security/tls.rs use; already in the tree as a rustls dependency, so this
# only makes it a direct one). License Apache-2.0 OR MIT (both allow-listed
# in deny.toml).
rustls-pki-types = "1"
# Key-material hygiene (#120): Zeroizing wrappers wipe PEM/DER private-key
# buffers on drop. License Apache-2.0 OR MIT (the Apache-2.0 branch is
# allow-listed in deny.toml); already in the tree as a rustls /
# rustls-pki-types dependency, so this only makes it a direct one.
zeroize = "1"
rcgen = "0.13"
# Property-based tests (DW-011 balancer coverage): Apache-2.0/MIT.
# GCRA rate limiting (DW-017): MIT. Runs on governor's default features
# (the GCRA math and the quanta clock); the keyed state store is our own
# sharded, size-capped implementation (extensions/rate_limiter.rs,
# #122) — governor's dashmap-backed store, though pulled in by its
# defaults, is no longer used.
governor = { version = "0.10" }
proptest = "1"
# SQLite state store (DW-018): rusqlite is MIT; the "bundled" feature
# compiles the bundled SQLite (public domain, libsqlite3-sys is MIT) so no
# system libsqlite3 is required at build or deploy time.
# Bumped 0.37 -> 0.38 (DW-115): rusqlite_migration 2.4 — the nearest
# release supporting our pinned rustc 1.94 — requires rusqlite ^0.38.
# The 0.37 -> 0.38 step is additive for the APIs this workspace uses.
rusqlite = { version = "0.38", features = ["bundled"] }
# Versioned SQLite schema migrations (DW-115): rusqlite_migration is
# MIT OR Apache-2.0. Pinned to 2.4 because 2.5 pulls rusqlite 0.39 and
# 2.6 requires rustc 1.95; the workspace pins 1.94. Applies migrations
# transactionally and tracks state in PRAGMA user_version (matching the
# DW-018 hand-rolled baseline).
rusqlite_migration = "2.4"
# Tempfile-backed on-disk store tests (DW-018 dev-only): MIT/Apache-2.0.
tempfile = "3"
# Authentication (DW-019): all MIT OR Apache-2.0. subtle is the standard
# constant-time comparison primitive; sha2 is the fast API-key hash path
# (hash-at-rest + hash-selector lookups); argon2 verifies OPTIONAL
# memory-hard PHC-format credential hashes (admin-supplied via the store —
# per-lookup argon2 is slow, so config-seeded keys hash with sha256);
# base64 decodes Basic credentials; jsonwebtoken verifies Bearer tokens
# against JWKS keys (RS/ES/Ed; its ring backend is already in the tree
# via rcgen). hmac (#124) peppers the stored fast-path hashes with a
# per-deployment secret (sha2 alone cannot HMAC); RustCrypto, MIT OR
# Apache-2.0, only `digest` beneath it (already in the tree).
subtle = "2"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
base64 = "0.22"
jsonwebtoken = "9"
# Observability (DW-021): all MIT. tracing provides the span/event
# substrate used across dwara-core; tracing-subscriber (binary/dev only)
# renders JSON logs with env filtering; prometheus with default features
# OFF keeps the protobuf exporter out of the tree (text format only).
tracing = "0.1"
# Local response cache (DW-037): moka is MIT OR Apache-2.0 (both
# allow-listed in deny.toml), pure Rust with no C. Only the `sync`
# cache is used (no future runtime, no quanta clock); `atomic64`
# keeps moka's own default of 64-bit atomics on our 64-bit targets.
# Consumed via the CacheStore extension seam (extensions/cache.rs)
# with a byte weigher + per-entry TTL, so eviction/freshness memory
# stays bounded.
moka = { version = "0.12", default-features = false, features = ["sync", "atomic64"] }
# Response compression codecs (DW-027): flate2 is MIT OR Apache-2.0
# (rust_backend = pure-Rust miniz_oxide, no C); brotli is MIT (pure
# Rust); zstd is MIT (zstd-sys binds the C libzstd, the same build
# profile as rusqlite's bundled SQLite and aws-lc-rs). All three are
# Write-based streaming encoders driven chunk-by-chunk by the dataplane's
# compression wrapper — no whole-body buffering anywhere.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "8"
zstd = "0.13"
# OTLP trace export (#126, default-off `otlp` feature on dwara-bin): the
# whole stack is feature-gated because it weighs on the musl release
# binary against the DW-026 25MB budget. opentelemetry-otlp carries ONLY
# http/protobuf (http-proto; no tonic/grpc transport, no reqwest client —
# dwara-bin ships a std-only exporter HTTP client, see its src/otlp.rs).
# tracing-opentelemetry is the era-appropriate span bridge:
# opentelemetry-appender-tracing has been logs-only since 0.28. All
# Apache-2.0 except tracing-opentelemetry (MIT).
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace"] }
tracing-opentelemetry = "0.33"
serial_test = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
prometheus = { version = "0.14", default-features = false }
# CLI argument parsing (DW-022): clap is MIT OR Apache-2.0; derive
# feature only to keep the dep tree small.
clap = { version = "4", features = ["derive"] }
# Micro-benchmark harness (DW-024, dev/bench-only): MIT OR Apache-2.0.
# default-features = false drops plotters/rayon (reporting deps we do not
# use); cargo_bench_support keeps `--output-format bencher` for the
# regression gate in .github/workflows/bench.yml.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = true
# DW-026 size bar: strip symbols from release binaries (the musl image
# lands well under 25 MB with this on; see quickstart/packaging notes).
# panic stays "unwind" — abort would change the gateway's error
# semantics (in-flight request failure vs process teardown).
strip = true
