[workspace]
resolver = "2"
members = [
    "crates/dwara-core",
    "crates/dwara-bin",
    "crates/dwara-admin",
    "crates/dwara-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "http2", "server-auto"] }
http-body-util = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
serde_json = "1"
async-trait = "0.1"
arc-swap = "1"
matchit = "0.9"
regex = "1"
notify = "8"
# TLS stack (DW-007): rustls with the aws-lc-rs provider (builds C via
# cmake/cc); tokio-rustls for async accept/connect. PEM loading uses
# rustls-pki-types PemObject directly (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134); rcgen (dev-only) generates test certificates.
rustls = { version = "0.23", default-features = true, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws-lc-rs"] }
rcgen = "0.13"

[profile.release]
lto = true
