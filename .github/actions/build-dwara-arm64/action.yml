name: 'Build dwara for ARM64'
description: >-
  Cross-compiles the dwara gateway binary and CLI for Linux ARM64
  (aarch64-unknown-linux-gnu) with the given cargo features, packages
  all produced binaries with sha256 checksums, and uploads them as a
  GitHub Actions artifact. Shared by the feature-matrix workflow's
  full-matrix and custom-build jobs.

inputs:
  features:
    description: 'Comma-separated cargo features for dwara-bin (e.g. "h3,otlp,dwara-core/wasm"). Empty = no features.'
    required: false
    default: ''
  cli_features:
    description: 'Comma-separated cargo features for dwara-cli (e.g. "k8s,ent"). Empty = no features.'
    required: false
    default: ''
  artifact_name:
    description: 'Name for the uploaded artifact (e.g. "dwara-arm64-custom-oss").'
    required: true
  retention_days:
    description: 'Artifact retention period in days.'
    required: false
    default: '3'
  cache_key:
    description: 'Cache key suffix for Swatinem/rust-cache.'
    required: false
    default: 'default'
  licensing_token:
    description: 'Fine-grained PAT with Contents:read on ShristiLabs/licensing. Pass secrets.LICENSING_TOKEN. Required for ent builds; no-op warning when empty.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable
      with:
        toolchain: "1.94.0"
        targets: aarch64-unknown-linux-gnu

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2
      with:
        key: feature-matrix-${{ inputs.cache_key }}

    - name: Install cross-compilation tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    # DW-032: the ent feature pulls in licensing-core from the private
    # ShristiLabs/licensing repo. The configure-licensing-repo action
    # is a no-op (warning only) when LICENSING_TOKEN is absent; ent
    # builds will then fail on fetch, non-ent builds are unaffected.
    - name: Configure private licensing repo access
      uses: ./.github/actions/configure-licensing-repo
      with:
        token: ${{ inputs.licensing_token }}

    - name: Build dwara-bin
      shell: bash
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      run: |
        FEATURES="${{ inputs.features }}"
        if [ -n "$FEATURES" ]; then
          cargo build --release --target aarch64-unknown-linux-gnu -p dwara-bin --features "$FEATURES"
        else
          cargo build --release --target aarch64-unknown-linux-gnu -p dwara-bin
        fi

    - name: Build dwara-cli
      shell: bash
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      run: |
        CLI_FEATURES="${{ inputs.cli_features }}"
        if [ -n "$CLI_FEATURES" ]; then
          cargo build --release --target aarch64-unknown-linux-gnu -p dwara-cli --features "$CLI_FEATURES"
        else
          cargo build --release --target aarch64-unknown-linux-gnu -p dwara-cli
        fi

    - name: Package artifacts
      shell: bash
      run: |
        mkdir -p dist
        BIN_DIR="target/aarch64-unknown-linux-gnu/release"
        cp "$BIN_DIR/dwara" dist/
        for BIN in dwara-cli dwara-loadgen dwara-controller dwara-edge dwara-k8s-controller; do
          if [ -f "$BIN_DIR/$BIN" ]; then
            cp "$BIN_DIR/$BIN" dist/
          fi
        done
        ( cd dist && sha256sum -- * > checksums.sha256 )
        ls -la dist/

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4
      with:
        name: ${{ inputs.artifact_name }}
        path: dist/*
        if-no-files-found: error
        retention-days: ${{ inputs.retention_days }}
