# DW-024 NFR verification harness (benchmark + regression gate).
#
# COMPUTE POSTURE: this workflow is SCHEDULED (weekly) and manually
# dispatchable ONLY. It deliberately has NO push/pull_request triggers —
# benchmarks are slow and noisy and must not run per-PR (see the repo's
# CI-cost conventions). ci.yml remains the per-PR gate.
#
# Jobs:
#   micro  — criterion micro-benchmarks + regression gate against the
#            checked-in baseline (crates/dwara-core/benches/baseline.json,
#            fail on >25% regression on any benchmark). GATE SEMANTICS: the
#            gate compares ONLY when the baseline was captured on the same
#            machine class as this runner (--expect-machine). The checked-in
#            baseline.json is the DEV-MACHINE reference (see its meta.note);
#            while it is the one in place, the gate SKIPS comparison with a
#            clear notice and fails open. BOOTSTRAP: immediately after this
#            workflow merges, dispatch the baseline refresh ONCE
#            (`gh workflow run bench.yml --ref main -f
#            job=baseline-refresh`) — it re-runs the benches on the CI
#            runner and commits a CI-captured baseline (meta.machine =
#            ubuntu-latest), after which the weekly gate compares
#            like-for-like.
#   baseline-refresh — manual (workflow_dispatch, `-f job=baseline-refresh`)
#            ONLY. Runs the micro benches ON THE CI RUNNER and COMMITS the
#            refreshed baseline back to this branch (job-level permissions:
#            contents: write; uses the repo's standard GITHUB_TOKEN — no
#            extra secrets).
#   macro  — Linux end-to-end load rig (gateway + echo upstream +
#            dwara-loadgen) at low/med/high concurrency, asserting errors=0,
#            plus the 100k-connection test with a raised fd limit.
#   soak   — 24h soak. DEFINED but DISABLED: it runs only when explicitly
#            dispatched with `-f job=soak`, so a 24h runner is never burned
#            by the weekly schedule or by a routine manual dispatch.
#
# Dispatch job selection (#127): the `job` input routes a manual run —
# empty/`gate` runs the weekly gate (micro+macro), `baseline-refresh` and
# `soak` run ONLY those jobs. Selecting via input (not per-job buttons) is
# forced by GitHub: a dispatch always evaluates every job's `if:`.

name: bench

permissions:
  contents: read

on:
  schedule:
    # Weekly, Monday 03:17 UTC (off the :00 mark to shed load).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run: gate (default; micro+macro), baseline-refresh, or soak"
        required: false
        default: "gate"
        type: choice
        options:
          - gate
          - baseline-refresh
          - soak

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  micro:
    name: micro benchmarks + regression gate
    # Weekly schedule or a gate dispatch. NOT on the baseline-refresh
    # dispatch (the refresh job re-runs the benches itself; a parallel
    # micro would just fail-open against the dev baseline the refresh is
    # about to replace) and not on soak dispatches.
    if: github.event_name == 'schedule' || inputs.job == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      # #126: compile check for the default-off otlp feature (OTLP trace
      # export on dwara-bin). Deliberately NOT in ci.yml: the opentelemetry
      # dep tree adds real compile time per push, and the feature is not
      # part of the shipped default build — a weekly (and dispatch) check
      # here catches feature rot at the cadence the maintainer chose.
      - name: Feature compile check (otlp)
        run: cargo check -p dwara-bin --features otlp

      - name: Run micro benchmarks (criterion, bencher format)
        # pipefail (#127): GitHub's default run shell is bash WITHOUT
        # pipefail, so a failing `cargo bench` previously hid behind
        # tee's exit 0 and the gate compared a truncated bench file.
        run: |
          set -o pipefail
          cargo bench --workspace --bench micro -- --output-format bencher | tee bench-output.txt

      - name: Regression gate vs baseline (fail on >25% regression)
        # Skips (fail-open) with a notice while the baseline is the
        # dev-machine reference; see the baseline-refresh job and the
        # header comment for the bootstrap flow.
        run: |
          scripts/bench-baseline.py --baseline crates/dwara-core/benches/baseline.json \
            --expect-machine ubuntu-latest < bench-output.txt

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4 @ ea165f8d
        with:
          name: micro-bench-output
          path: bench-output.txt

  baseline-refresh:
    name: refresh micro baseline on the CI runner (dispatch only)
    # Manual ONLY, selected by input (#127 bootstrap): re-captures
    # benches/baseline.json on the same runner class the weekly `micro`
    # gate uses, and commits the result back to the ref it was dispatched
    # on. This is the bootstrap step after this workflow first merges
    # (the checked-in baseline is a dev-machine reference; cross-machine
    # ns/iter comparison is invalid). Dispatch once after merge:
    #   gh workflow run bench.yml --ref main -f job=baseline-refresh
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'baseline-refresh'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      - name: Run micro benchmarks and write CI-captured baseline
        # pipefail (#127): a failing `cargo bench` must fail the pipeline,
        # not hide behind the writer script's exit 0 (which would commit a
        # baseline parsed from truncated output — the script does reject
        # empty input, but pipefail fails the step at the source).
        run: |
          set -o pipefail
          cargo bench --workspace --bench micro -- --output-format bencher \
            | scripts/bench-baseline.py --write crates/dwara-core/benches/baseline.json \
                --force --machine ubuntu-latest

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/dwara-core/benches/baseline.json
          if git diff --cached --quiet; then
            echo "baseline unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(bench): refresh micro baseline on ubuntu-latest CI runner"
          git push

  macro:
    name: macro load rig (gateway end-to-end)
    # Same trigger surface as `micro` minus the refresh leg: weekly
    # schedule or an explicit gate dispatch. Never on soak dispatches
    # (that runner budget belongs to the soak).
    if: github.event_name == 'schedule' || inputs.job == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      - name: Run load profiles (low/med/high concurrency, errors must be 0)
        run: scripts/bench-macro.sh 20 10 100 1000

      - name: 100k connections test (best-effort on the standard runner)
        # The NFR bar is 100k concurrent connections. The standard
        # ubuntu-latest runner does not advertise a large-runner fd budget;
        # this step raises the soft/hard limits first and is best-effort
        # (continue-on-error) — treat a red X here as "needs a larger
        # runner or a dedicated host", not a code regression. On a
        # dedicated Linux host: ulimit -n 1048576 before running.
        #
        # MAINTAINER DECISION (#127): this STAYS best-effort on the
        # standard runner — the continue-on-error is deliberate, not a
        # pending fix. Upgrading to a guaranteed 100k runner is a
        # cost/infra decision that has been explicitly declined for the
        # weekly cadence; dedicated-host verification remains available
        # via scripts/bench-macro.sh (see its header) when needed.
        continue-on-error: true
        run: |
          ulimit -n 1048576 || ulimit -n "$(ulimit -Hn)"
          ulimit -n
          scripts/bench-macro.sh 60 10000 100000

  soak:
    name: 24h soak (manual only — disabled by default)
    # DELIBERATELY NOT SCHEDULED and not on routine dispatches (#127): a
    # 24h soak burns a runner for a day, so it runs ONLY when the
    # dispatch input explicitly selects it:
    #   gh workflow run bench.yml --ref main -f job=soak
    # (or Actions tab -> bench -> Run workflow -> job: soak), e.g. ahead
    # of a release. Before the `job` input existed, ANY manual dispatch
    # of this workflow also started the soak as a side effect.
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'soak'
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      - name: Soak (24h at moderate concurrency; errors must be 0)
        run: |
          ulimit -n "$(ulimit -Hn)"
          scripts/bench-macro.sh 86400 100
