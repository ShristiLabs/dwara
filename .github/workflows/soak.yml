# REL-03 (#174) nightly soak with RSS-ceiling and p99-drift assertions.
#
# COMPUTE POSTURE: SCHEDULED (nightly) and manually dispatchable ONLY.
# No push/pull_request triggers -- the soak drives sustained load for
# several minutes (default 10) and asserts memory/latency ceilings that
# the per-PR gate (ci.yml) and the macro regression gate
# (bench-nightly.yml) cannot catch: a slow memory leak or latency drift
# only shows under sustained load. The schedule is offset from
# bench-nightly (04:17 UTC) and chaos (Wed 05:11 UTC) so the three never
# contend for runners.
#
# The 24h soak referenced in the issue runs on DEDICATED HOSTS: dispatch
# this workflow with duration=86400 (and a raised timeout) ahead of a
# release. The nightly CI duration stays short (10 min) to bound runner
# cost; the assertions are the same either way.
#
# Job:
#   soak -- runs scripts/soak.sh, which boots the gateway + an echo
#           upstream, drives sustained load via dwara-loadgen in
#           fixed-width windows, samples the gateway RSS and the window
#           p99 after each window, and pipes the sample stream to
#           scripts/soak.py for the RSS-ceiling and p99-drift
#           assertions. The duration, rate, ceilings, and window size
#           are all configurable via dispatch inputs (and env defaults
#           in the script).
#
# NOTE: bench.yml has a separate manual-only 24h soak job (#127) that
# runs scripts/bench-macro.sh 86400 100 with NO assertions. This job is
# the ASSERTING soak (nightly + dispatch); the two are complementary.

name: soak

permissions:
  contents: read

on:
  schedule:
    # Nightly, 06:13 UTC (off the :00 mark to shed load; distinct from
    # bench-nightly's 04:17 slot and chaos's Wed 05:11 slot).
    - cron: "13 6 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Total soak seconds (default 600; use 86400 for a 24h run)"
        required: false
        default: "600"
        type: string
      rate:
        description: "Target requests per second (0 = unbounded)"
        required: false
        default: "1000"
        type: string
      connections:
        description: "Concurrent connections"
        required: false
        default: "50"
        type: string
      sample_secs:
        description: "Per-window loadgen seconds (the sample cadence)"
        required: false
        default: "30"
        type: string
      rss_ceiling_kb:
        description: "Max gateway RSS in KB (default 262144 = 256MB)"
        required: false
        default: "262144"
        type: string
      p99_drift:
        description: "Max fractional p99 drift (default 0.50 = 50%)"
        required: false
        default: "0.50"
        type: string

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: nightly soak (RSS ceiling + p99 drift)
    runs-on: ubuntu-latest
    # 60-min timeout covers the nightly default (10-min soak + build +
    # headroom). For a 24h dispatch (duration=86400), raise this value
    # or run on a self-hosted runner with no timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      - name: Run the soak harness + assertion gate
        env:
          SOAK_DURATION: ${{ inputs.duration }}
          SOAK_RATE: ${{ inputs.rate }}
          SOAK_CONNECTIONS: ${{ inputs.connections }}
          SOAK_SAMPLE_SECS: ${{ inputs.sample_secs }}
          SOAK_RSS_CEILING_KB: ${{ inputs.rss_ceiling_kb }}
          SOAK_P99_DRIFT: ${{ inputs.p99_drift }}
        run: |
          set -euo pipefail
          # Raise the file-descriptor cap so the loadgen can open its
          # connection pool (two sockets per connection pair). The hard
          # limit is the ceiling on Linux CI runners.
          ulimit -n "$(ulimit -Hn)" || true
          # Tee stdout (the SAMPLE: stream + the gate summary) to a log
          # so the artifact step can upload it; stderr progress stays on
          # the live workflow console.
          scripts/soak.sh 2>&1 | tee soak-stdout.log

      - name: Upload soak samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4 @ ea165f8d
        with:
          name: soak-samples
          # The stdout stream (captured above) carries the per-window
          # SAMPLE: lines and the assertion-gate summary.
          path: soak-stdout.log
