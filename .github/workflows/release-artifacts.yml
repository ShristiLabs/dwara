name: release-artifacts

# DW-026: version-tags-only artifact publishing (standing CI cost policy:
# no image builds on PRs or pushes to main). Builds the static musl
# binaries for amd64+arm64 (the arm64 leg via QEMU emulation), enforces
# the <25 MB size bar, uploads checksummed dwara-<ver>-<target>.tar.gz
# tarballs, and pushes multi-arch scratch and distroless images to GHCR.
# The images are built FROM the size-bar-verified artifacts of the
# musl-binaries job (#127): the images job downloads them, re-verifies
# the sha256 checksums, and COPYs the binaries into the release
# Dockerfiles (Dockerfile.release-{scratch,distroless}) — nothing is
# compiled twice, and the published images are byte-for-byte the
# published tarball binaries.

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  musl-binaries:
    name: musl binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      # QEMU lets the arm64 leg run the aarch64 rust:1.94-alpine image
      # (docker run --platform linux/arm64) on the x86_64 runner. The
      # emulated build is several times slower than native
      # cross-compilation, which is acceptable here only because this
      # workflow runs on version tags. (The images job no longer needs
      # QEMU since #127: it only COPYs prebuilt static binaries.)
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # pinned: v3 @ c7c53464

      - name: Build in rust:1.94-alpine (musl, static)
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/build -w /build \
            -e CARGO_TERM_COLOR=always \
            rust:1.94-alpine sh -c '
              apk add --no-cache musl-dev cmake make perl &&
              rustup target add '"${{ matrix.target }}"' &&
              cargo build --release --target '"${{ matrix.target }}"' --bin dwara -p dwara-bin &&
              cargo build --release --target '"${{ matrix.target }}"' --bin dwara-cli -p dwara-cli
            '

      - name: Size bar (25 MB, DW-026)
        run: |
          # Both shipped binaries must stay under the bar; a failing
          # test aborts the step (bash -e).
          for BIN in dwara dwara-cli; do
            SIZE=$(stat -c%s "target/${{ matrix.target }}/release/${BIN}")
            MB=$(( (SIZE + 1048575) / 1048576 ))
            echo "${BIN}: ${MB} MB (${SIZE} bytes)"
            test "$SIZE" -le 26214400
          done

      - name: Package tarball and checksum (DW-026)
        run: |
          VER="${{ github.ref_name }}"
          TARBALL="dwara-${VER}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${TARBALL}" \
            -C "target/${{ matrix.target }}/release" \
            dwara dwara-cli
          # Bare filename inside the .sha256 so `sha256sum -c` works
          # next to the downloaded tarball.
          ( cd dist && sha256sum "${TARBALL}" > "${TARBALL}.sha256" )
          cat "dist/${TARBALL}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4 @ ea165f8d
        with:
          name: dwara-linux-musl-${{ matrix.arch }}
          path: dist/*

  images:
    name: images (multi-arch, from verified musl artifacts)
    # #127: reuse the binaries the musl-binaries job already built,
    # size-barred, checksummed, and uploaded — no second compile of
    # either arch. The release Dockerfiles have no RUN step (static
    # binaries are only COPYed), so no QEMU setup is needed here even
    # for the arm64 platform leg.
    runs-on: ubuntu-latest
    needs: musl-binaries
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # pinned: v5 @ fbc6f399

      - name: Download size-bar-verified musl artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned: v4 @ d3f86a10
        with:
          # Both matrix legs (dwara-linux-musl-amd64 / -arm64) uploaded
          # tarball + .sha256; merged into one directory, no collisions
          # (filenames carry the target triple).
          path: dist
          pattern: dwara-linux-musl-*
          merge-multiple: true

      - name: Verify checksums and stage per-arch binaries
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cd ..
          # Layout the release Dockerfiles COPY from (staged/<arch>/dwara).
          mkdir -p staged/amd64 staged/arm64
          tar -xzf dist/dwara-*-x86_64-unknown-linux-musl.tar.gz -C staged/amd64
          tar -xzf dist/dwara-*-aarch64-unknown-linux-musl.tar.gz -C staged/arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # pinned: v3 @ 8d2750c6

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # pinned: v3 @ c94ce9fb
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scratch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # pinned: v6 @ 10e90e36
        with:
          context: .
          file: ./Dockerfile.release-scratch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scratch-${{ github.ref_name }}

      - name: Build and push distroless image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # pinned: v6 @ 10e90e36
        with:
          context: .
          file: ./Dockerfile.release-distroless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:distroless-${{ github.ref_name }}
