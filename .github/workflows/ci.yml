name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
      - "config-reference.json"
      - "scripts/check_deps.py"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
      - "config-reference.json"
      - "scripts/check_deps.py"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # Dependency-direction guard: keeps the bounded-context layering
      # documented in dwara-core's lib.rs enforceable, not aspirational.
      - name: Dependency direction
        run: python3 scripts/check_deps.py

      # DW-026: the committed schema-derived config reference must be
      # exactly what `dwara-cli schema` emits.
      - name: Config reference freshness
        run: cargo run -q -p dwara-cli --bin dwara-cli -- schema | diff config-reference.json -

  supply-chain:
    name: cargo-deny and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny check (advisories, licenses, bans)
        run: cargo deny check advisories licenses bans

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX 1.5)
        run: cargo cyclonedx --format json --spec-version 1.5

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: crates/*/*.cdx.json
          if-no-files-found: error
