name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
      - "config-reference.json"
      - "scripts/check_deps.py"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
      - "config-reference.json"
      - "scripts/check_deps.py"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      # DW-032: the ent feature (off by default) pulls in licensing-core
      # from the private ShristiLabs/licensing repo. cargo metadata (run by
      # cargo fmt) resolves optional deps, so git must authenticate even
      # though the feature is not enabled in CI.
      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ShristiLabs/".insteadOf "https://github.com/ShristiLabs/"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # Dependency-direction guard: keeps the bounded-context layering
      # documented in dwara-core's lib.rs enforceable, not aspirational.
      - name: Dependency direction
        run: python3 scripts/check_deps.py

      # DW-026: the committed schema-derived config reference must be
      # exactly what `dwara-cli schema` emits.
      - name: Config reference freshness
        run: cargo run -q -p dwara-cli --bin dwara-cli -- schema | diff config-reference.json -

  supply-chain:
    name: cargo-deny and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v5 @ fbc6f399

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned: stable @ 4360b525
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # pinned: v2 @ 6323deb1

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ShristiLabs/".insteadOf "https://github.com/ShristiLabs/"

      - name: Install cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # pinned: v2 @ fcf5432d
        with:
          tool: cargo-deny

      - name: Deny check (advisories, licenses, bans)
        run: cargo deny check advisories licenses bans

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # pinned: v2 @ fcf5432d
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX 1.5)
        run: cargo cyclonedx --format json --spec-version 1.5

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned: v4 @ ea165f8d
        with:
          name: sbom-cyclonedx
          path: crates/*/*.cdx.json
          if-no-files-found: error
