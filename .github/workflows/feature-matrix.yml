name: feature-matrix

# Build the dwara binary for Linux ARM64 (aarch64-unknown-linux-gnu)
# for the two supported editions:
#
# 1. oss (default): the standard build with all folded capabilities.
# 2. enterprise: the OSS build plus the `ent` feature (license
#    verification, Redis rate limiter, CP/DP split, etc.).
#
# The ent feature requires the LICENSING_TOKEN secret to fetch the
# private ShristiLabs/licensing repo. Without the secret, ent builds
# fail; the OSS build succeeds (fail-fast: false).
#
# loom is excluded (test-only, not a build artifact).
# Artifacts are retained for 3 days by default.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Artifact retention in days.'
        type: string
        default: '3'
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/feature-matrix.yml"

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- OSS edition (default build, all folded capabilities) ---
          - name: oss
            features: ""
            cli_features: ""
          # --- Enterprise edition (OSS + ent) ---
          - name: enterprise
            features: "ent"
            cli_features: "ent"

    steps:
      # Checkout must run before referencing a local composite action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned: v7.0.1

      - uses: ./.github/actions/build-dwara-arm64
        with:
          features: ${{ matrix.features }}
          cli_features: ${{ matrix.cli_features }}
          artifact_name: dwara-arm64-${{ matrix.name }}
          retention_days: ${{ github.event.inputs.retention_days || '3' }}
          cache_key: ${{ matrix.name }}
          licensing_token: ${{ secrets.LICENSING_TOKEN }}
