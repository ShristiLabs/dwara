# OSS quickstart gateway config: a comprehensive, feature-complete
# demonstration of every OSS capability in a single runnable config.
#
# Run `../gen-certs.sh` first (writes ../certs, including the client CA
# and client cert for the admin API's mTLS), then `docker compose up`.
# Every feature below is available in the default OSS build (no cargo
# feature packs, no enterprise license). Features that need external
# services (JWKS, OIDC, AI providers) are configured with example
# endpoints — the gateway starts and routes traffic regardless; those
# paths activate when a real service is reachable.
#
# The config is organized top-down: listeners, routes, services,
# upstreams, consumers, policies, then gateway-level blocks (auth
# providers, admin, analytics, AI, webhooks, global settings).

# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------

listeners:
  # TLS-terminated HTTPS listener (the primary entry point).
  - name: edge-https
    address: 0.0.0.0
    port: 8443
    protocol: https
    # Accept PROXY protocol v1/v2 header as the first bytes of every
    # connection (for running behind a Layer 4 load balancer).
    proxy_protocol: false
    tls:
      mode: terminate
      cert_file: /etc/dwara/certs/server.crt
      key_file: /etc/dwara/certs/server.key
      # Require client certificates chained to this CA (mTLS client
      # auth, DW-019). The client CA is generated by gen-certs.sh.
      client_ca_file: /etc/dwara/certs/client-ca.crt
      # Additional SNI-scoped certificate pairs (multi-SNI terminate).
      # Each entry serves the listed server_names; the single
      # cert_file/key_file pair above is the fallback for unmatched SNI.
      certificates:
        - server_names:
            - api.example.com
          cert_file: /etc/dwara/certs/server.crt
          key_file: /etc/dwara/certs/server.key
    # Listener-level authorization (the second-least-specific link of
    # the consumer > route > service > listener > global chain).
    authorization:
      ip_acl:
        allow:
          - 10.0.0.0/8
          - 192.168.0.0/16
          - 127.0.0.1
        default: allow
    # Policies attached to this listener apply to every request on it.
    policies:
      - listener-rate-limit
    # Advertise the HTTP listener's upgrade path (Alt-Svc header).
    alt_svc: h2=":8080"

  # Plaintext HTTP listener (for local dev / health checks).
  - name: edge-http
    address: 0.0.0.0
    port: 8080
    protocol: http

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------

routes:
  # --- API route: proxy with transforms, security headers, CORS,
  #     compression, caching, rate limiting, auth, WAF, SLO ---
  # Match criteria are intentionally minimal (path + methods) so the
  # route is testable with a simple curl. Additional match criteria
  # (host, headers, query, cookies, accept) are shown commented-out
  # below — all criteria are AND-ed, so adding any narrows the match.
  - name: api-v1
    service: api-service
    match:
      path:
        type: prefix
        value: /v1/
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      # host: localhost
      # headers:
      #   x-api-version: "1"
      # query:
      #   - name: trace
      # cookies:
      #   - name: session
      # accept: application/json
    action:
      type: proxy
      rewrite:
        type: strip_prefix
    # Per-route method allowlist (DW-030): a matched request whose
    # method is not listed gets 405 + Allow header.
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    # Require authentication (DW-019): no recognized credential = 401.
    auth_required: true
    # Route-level authorization (DW-020).
    authorization:
      allowed_consumers:
        - mobile-app
        - partner-mtls
      allowed_groups:
        - internal
      # required_scopes: [read]  # JWT-only; API keys carry no scopes
      ip_acl:
        # No allow list + default: allow = all IPs pass the gate.
        default: allow
    # Request/response transforms (DW-028): header and query
    # manipulation on the forwarded request and the returned response.
    transforms:
      request:
        headers:
          set:
            X-Forwarded-By: dwara
            X-Request-Source: quickstart
          add:
            X-Gateway-Version: oss
          remove:
            - X-Internal-Token
        query:
          add:
            source: gateway
      response:
        headers:
          set:
            X-Served-By: dwara-oss
    # Security-header injection (DW-028): HSTS, nosniff, CSP,
    # X-Frame-Options stamped on every response.
    security_headers:
      hsts_max_age_secs: 31536000
      hsts_include_subdomains: true
      hsts_preload: true
      nosniff: true
      frame_options: deny
      content_security_policy: "default-src 'self'"
    # CORS policy (DW-027): preflight handling + actual-response headers.
    cors:
      allowed_origins:
        - "https://app.example.com"
      allowed_methods:
        - GET
        - POST
        - PUT
        - DELETE
      allowed_headers:
        - Content-Type
        - Authorization
        - X-API-Key
      expose_headers:
        - X-Request-Id
      allow_credentials: true
      max_age_secs: 3600
    # Response compression (DW-027): negotiate gzip/brotli/zstd.
    compression:
      algorithms:
        - gzip
        - brotli
      min_size: 1024
      content_types:
        - text/
        - application/json
      excluded_content_types:
        - text/event-stream
    # Response caching (DW-037): TTL + stale-while-revalidate + vary
    # + request coalescing (DW-038: collapse concurrent identical GETs).
    cache:
      ttl_secs: 60
      stale_while_revalidate_secs: 300
      max_body_bytes: 1048576
      vary:
        - accept
        - accept-encoding
      coalescing:
        wait_ms: 5000
    # Request size limits (DW-027).
    limits:
      max_body_bytes: 1048576
      max_header_bytes: 8192
      max_header_count: 50
    # WAF-lite heuristic filtering (DW-051).
    waf:
      enabled: true
      filters:
        - sqli
        - xss
        - path_traversal
      max_body_inspect_bytes: 4096
    # Request validation (DW-047): JSON-schema body check before action.
    # Commented out — applies to ALL methods including GET (which has no
    # body). Uncomment and scope to POST/PUT routes in production.
    # request_validation:
    #   body_schema:
    #     type: object
    #     properties:
    #       name:
    #         type: string
    #     required:
    #       - name
    # Response field masking (DW-029): fail-closed redaction.
    # Commented out — masking rejects non-JSON responses (cannot prove
    # fields absent in HTML). Uncomment for JSON-returning upstreams.
    # masking:
    #   max_bytes: 1048576
    #   fields:
    #     - /password
    #     - /secret
    #   groups:
    #     internal:
    #       - /internal_debug
    # API deprecation signals (DW-048): IMF-fixdate format.
    # The day-of-week must match the date. Use future dates for
    # sunset (a past sunset is a validation error — the route should
    # be removed, not advertised as pending removal).
    deprecation:
      since: Wed, 01 Jan 2025 00:00:00 GMT
      sunset: Fri, 01 Jan 2027 00:00:00 GMT
      uri: https://docs.example.com/migration
    # SLO (DW-052): availability + latency objectives.
    slo:
      availability: 99.9
      latency_ms: 500
      latency_target: 95
    # Request hedging (DW-063): send a speculative copy after 200ms.
    # (Configured on the upstream's retry policy, referenced here via
    # the service's policy attachment.)
    # Shadow traffic mirroring (DW-062).
    mirror:
      upstream: mirror-upstream
      percentage: 10
    # Fault injection (DW-062): 5% of requests get a 100ms delay,
    # 1% of requests are aborted with 503 (chaos testing).
    fault_injection:
      delay:
        percentage: 5
        fixed_ms: 100
      abort:
        percentage: 1
        status: 503
    # WebSocket policy (DW-039).
    websocket:
      origins:
        - "https://app.example.com"
      max_frames_per_sec: 100
    # Priority for load shedding (DW-016): 8 = high priority.
    priority: 8
    # Attached policies (rate limit + retry + timeout + anomaly).
    policies:
      - api-rate-limit
      - api-retry
      - anomaly-detection

  # --- Regex route: path-parameter matching ---
  - name: users-by-id
    service: api-service
    match:
      path:
        type: regex
        value: /v1/users/[^/]+
    action:
      type: proxy
    auth_required: true
    policies:
      - api-rate-limit

  # --- Exact route: health check (respond directly) ---
  - name: healthz
    service: api-service
    match:
      path:
        type: exact
        value: /healthz
    action:
      type: respond
      status: 200
      body: ok
      headers:
        Content-Type: text/plain

  # --- Redirect route: legacy path migration ---
  - name: legacy-redirect
    service: api-service
    match:
      path:
        type: prefix
        value: /users
    action:
      type: redirect
      scheme: https
      host: localhost
      path: /v1/users
      status: 301

  # --- Mock route: synthetic response for testing ---
  - name: mock-api
    service: api-service
    match:
      path:
        type: exact
        value: /v1/mock
    action:
      type: mock
      status: 200
      body: '{"mock": true}'
      headers:
        Content-Type: application/json
      delay_ms: 50

  # --- Maintenance route: 503 + Retry-After (disabled by omission) ---
  # To enable maintenance, uncomment the maintenance block:
  # - name: deprecated-endpoint
  #   service: api-service
  #   match:
  #     path:
  #       type: prefix
  #       value: /v1/deprecated
  #   action:
  #     type: proxy
  #   maintenance:
  #     retry_after_secs: 120
  #     message: "This endpoint is under maintenance"

  # --- Canary route: traffic splitting (DW-040) ---
  # The service 'canary-service' splits traffic between two upstreams.
  - name: canary
    service: canary-service
    match:
      path:
        type: prefix
        value: /v1/canary
    action:
      type: proxy
    policies:
      - api-rate-limit

  # --- AI route: provider translation (DW-075) ---
  - name: ai-chat
    service: ai-service
    match:
      path:
        type: exact
        value: /v1/chat/completions
      methods:
        - POST
    action:
      type: ai
    auth_required: true
    authorization:
      allowed_consumers:
        - mobile-app
        - support-bot
    policies:
      - ai-token-budget

  # --- Demo route: serve the index page from the nginx upstream.
  # Uses exact:/ (highest precedence) so it only matches the root path.
  # Unmatched paths return 404 — correct gateway behavior. A regex /.*
  # catch-all would shadow all prefix routes (regex > prefix in lookup
  # precedence), so it is intentionally avoided here.
  - name: demo
    service: demo
    match:
      path:
        type: exact
        value: /
    action:
      type: proxy

  # --- Dynamic discovery route (DW-042) ---
  - name: dynamic
    service: dynamic-service
    match:
      path:
        type: prefix
        value: /dynamic/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

  # --- Latency-aware route (DW-090) ---
  - name: latency-aware
    service: latency-service
    match:
      path:
        type: prefix
        value: /latency/
    action:
      type: proxy
      rewrite:
        type: strip_prefix

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:
  # Primary API service with base_path and version.
  - name: api-service
    upstream: api-upstream
    base_path: /v1
    version: v1
    policies:
      - default-timeouts

  # Canary service: weighted traffic split across two upstreams
  # (DW-040). 90% to the stable upstream, 10% to the canary.
  - name: canary-service
    split:
      targets:
        - upstream: api-upstream
          weight: 90
        - upstream: canary-upstream
          weight: 10
      # Auto-canary analysis (DW-091): a background controller
      # compares canary vs baseline and auto-adjusts weights.
      canary_analysis:
        window_seconds: 300
        step: 5
        min_requests: 100
        cooldown_seconds: 60
        promote:
          metric: error_rate
          threshold: 0.01
        rollback:
          metric: error_rate
          threshold: 0.05

  # Sticky session service (DW-040): cookie affinity.
  - name: sticky-service
    upstream: api-upstream
    sticky:
      cookie: dwara-affinity
      ttl_s: 3600

  # AI service (the upstream is not dialed for AI routes; the AI
  # provider's upstream is used instead, but the service is still
  # required by the schema).
  - name: ai-service
    upstream: ai-provider-upstream

  # Demo service: the nginx upstream.
  - name: demo
    upstream: demo-upstream

  # Dynamic discovery service (DW-042): uses DNS-discovered endpoints.
  - name: dynamic-service
    upstream: dynamic-upstream

  # Latency-aware service (DW-090): uses peak-EWMA load balancing.
  - name: latency-service
    upstream: latency-aware-upstream

# ---------------------------------------------------------------------------
# Upstreams
# ---------------------------------------------------------------------------

upstreams:
  # Primary API upstream: least-requests LB, health checks,
  # retries, timeouts, circuit breaker, connection cap.
  # Uses http1 toward the plaintext nginx upstream (h2 requires TLS
  # or h2c-prior-knowledge on the upstream side; nginx:alpine speaks
  # http1 by default). Multiple endpoints would need distinct hosts.
  - name: api-upstream
    load_balancer: least_requests
    protocol: http1
    endpoints:
      - address: upstream
        port: 80
        weight: 3
    # Passive health checking / outlier detection (DW-012).
    health:
      consecutive_failures: 5
      eject_ms: 30000
      failure_ratio: 0.5
      failure_min_volume: 20
      half_open_probes: 1
      window_ms: 60000
    # Active health checks (DW-013): synthetic HTTP probes.
    active_health:
      kind: http
      path: /healthz
      interval_ms: 5000
      timeout_ms: 2000
      jitter_ms: 500
      failure_threshold: 3
      success_threshold: 2
    # Retries with hedging (DW-014, DW-063). Hedging requires
    # buffer_max_bytes > 0 (the body must be replayable to send a
    # hedge copy).
    retries:
      attempts: 3
      backoff_base_ms: 25
      backoff_cap_ms: 250
      budget_percent: 10
      buffer_max_bytes: 1048576
      retry_statuses:
        - 502
        - 503
        - 504
      retry_transport: true
      hedge:
        hedge_after_ms: 200
        hedge_max: 1
    # Timeouts (DW-014): connect/read/write + happy-eyeballs (RFC 8305).
    timeouts:
      connect_ms: 2000
      read_ms: 30000
      write_ms: 30000
      happy_eyeballs_ms: 250
    # Circuit breaker (DW-015).
    breaker:
      consecutive_failures: 5
      error_ratio: 0.5
      error_volume: 20
      open_ms: 30000
      half_open_probes: 1
    # Connection cap (DW-015).
    connection_cap: 100
    max_pending: 50
    # Slow start (DW-011): gradually ramp up new endpoints.
    slow_start_ms: 10000

  # Canary upstream: a second pool for traffic splitting.
  - name: canary-upstream
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: upstream
        port: 80
    health:
      consecutive_failures: 3
      eject_ms: 15000
    retries:
      attempts: 2
      backoff_base_ms: 50
      backoff_cap_ms: 500
    timeouts:
      connect_ms: 2000
      read_ms: 15000

  # Mirror upstream: receives shadow traffic (DW-062).
  - name: mirror-upstream
    load_balancer: random
    protocol: http1
    endpoints:
      - address: upstream
        port: 80

  # DNS-discovered upstream (DW-042): dynamic endpoint discovery.
  # Uses a real externally-resolvable hostname so the DNS discovery
  # background task finds A records. In production this would be your
  # service's DNS name (e.g. my-service.example.com). The static
  # endpoints below are the seed set; DNS discovery refreshes them.
  - name: dynamic-upstream
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: upstream
        port: 80
    dns_discovery:
      hostname: example.com
      port: 80
      record_type: A
      refresh_interval_s: 300
      min_endpoints: 1
      fail_open: true

  # Peak-EWMA latency-aware upstream (DW-090).
  - name: latency-aware-upstream
    load_balancer: peak_ewma
    protocol: http1
    endpoints:
      - address: upstream
        port: 80
    peak_ewma:
      decay_ms: 10000
      default_rtt_ms: 250

  # AI provider upstream: carries the transport to the AI provider.
  # OAuth2 client-credentials proxying (DW-035): the gateway obtains
  # an access token from the token endpoint and forwards it as
  # Authorization: Bearer to the upstream.
  - name: ai-provider-upstream
    load_balancer: round_robin
    protocol: https
    endpoints:
      - address: api.openai.com
        port: 443
    timeouts:
      connect_ms: 5000
      read_ms: 120000
    oauth2_client_credentials:
      token_endpoint: https://idp.example.com/oauth2/token
      # Inline placeholders — production: use ${OAUTH2_CLIENT_ID} etc.
      client_id: quickstart-oauth2-id
      client_secret: quickstart-oauth2-secret
      scopes:
        - api
      token_cache_ttl_s: 3600

  # Demo upstream: the nginx static server.
  - name: demo-upstream
    load_balancer: round_robin
    protocol: http1
    endpoints:
      - address: upstream
        port: 80

# ---------------------------------------------------------------------------
# Consumers (authentication identities)
# ---------------------------------------------------------------------------

consumers:
  # Mobile app consumer: API key + JWT credentials.
  - name: mobile-app
    type: user
    groups:
      - internal
    credentials:
      - type: api_key
        key: dwara-quickstart-api-key
      - type: jwt
        issuer: https://auth.example.com
        audiences:
          - api-service
      - type: hmac
        key_id: mobile-hmac-key
        secret: dwara-quickstart-hmac-secret
    policies:
      - mobile-quota
    # Consumer quotas (DW-033): daily + monthly request caps.
    quotas:
      daily_requests: 100000
      monthly_requests: 1000000
    # Consumer priority for load shedding.
    priority: 8
    # Per-consumer AI token budget (DW-113).
    token_budget:
      tokens_per_min: 100000
      cost_per_day_micros: 1000000
      scope: consumer
    # AI prompt logging override (DW-081).
    ai_logging: true

  # Partner consumer: mTLS client certificate.
  - name: partner-mtls
    type: user
    groups:
      - external
    credentials:
      - type: mtls
        subject: dwara-admin-client
    policies:
      - partner-quota

  # Agent consumer (DW-113): a bot principal with tool allowlist.
  - name: support-bot
    type: agent
    groups:
      - internal
    credentials:
      - type: api_key
        key: dwara-quickstart-bot-key
    policies:
      - bot-quota
    # MCP tool allowlist (DW-113).
    tool_allowlist:
      - search_docs
      - get_status
    token_budget:
      tokens_per_min: 50000
      cost_per_day_micros: 500000
      scope: consumer

# ---------------------------------------------------------------------------
# Policies (reusable rule bundles)
# ---------------------------------------------------------------------------

policies:
  # Rate limiting: single-window GCRA (DW-017).
  - name: api-rate-limit
    rate_limit:
      requests: 1000
      window_seconds: 60

  # Stacked rate limiting: per-second + per-minute windows (DW-017).
  - name: mobile-quota
    rate_limits:
      - selector:
          - ip
          - credential
        requests_per:
          s: 100
          minute: 5000
        burst: 200
    # Adaptive rate-limit tuning (DW-089).
    adaptive:
      enabled: true
      min_factor: 0.1
      max_factor: 2.0
      error_threshold: 0.05
      latency_threshold_ms: 500
      ewma_window_secs: 60

  - name: partner-quota
    rate_limit:
      requests: 500
      window_seconds: 60

  - name: bot-quota
    rate_limit:
      requests: 200
      window_seconds: 60

  - name: listener-rate-limit
    rate_limit:
      requests: 10000
      window_seconds: 60

  # Retry policy (DW-014).
  - name: api-retry
    # (Retry config is on the upstream; this policy is a placeholder
    # for consumer/route-level retry attachment.)
    timeouts:
      connect_ms: 2000
      read_ms: 30000

  # Timeout policy.
  - name: default-timeouts
    timeouts:
      connect_ms: 5000
      read_ms: 60000
      write_ms: 60000

  # AI token budget policy (DW-078).
  - name: ai-token-budget
    token_budget:
      tokens_per_min: 200000
      cost_per_day_micros: 5000000
      scope: policy

  # Anomaly scoring policy (DW-090).
  - name: anomaly-detection
    anomaly:
      enabled: true
      threshold: 0.8
      dry_run: false
      signals:
        - header_entropy
        - header_count
        - header_bytes
        - path_length
        - path_depth
        - query_count
        - body_size
        - method_unusual
      max_body_inspect_bytes: 4096

# ---------------------------------------------------------------------------
# Gateway-level global policies
# ---------------------------------------------------------------------------

# Global policies apply to EVERY request (including unrouted 404s),
# except the reserved /healthz, /readyz, /metrics paths.
global_policies:
  - listener-rate-limit

# Gateway-level authorization (least specific link of the chain).
authorization:
  ip_acl:
    # No allow list + default: allow = all IPs pass the gate.
    default: allow

# ---------------------------------------------------------------------------
# Authentication providers
# ---------------------------------------------------------------------------

# JWT verification providers (DW-019): JWKS-based token verification.
# Keys are fetched lazily on the first Bearer token — the gateway
# starts fine even if the endpoint is not yet reachable.
jwt_providers:
  - name: auth0
    jwks_url: https://auth.example.com/.well-known/jwks.json
    issuer: https://auth.example.com
    audience: api-service
    consumer: mobile-app
    algorithms:
      - RS256
      - ES256
    leeway_secs: 30
    refresh_secs: 300

# OIDC providers (DW-034): token introspection (RFC 7662).
oidc_providers:
  - name: keycloak
    issuer: https://idp.example.com
    client_id: dwara-quickstart
    # Inline placeholder — production: use ${OIDC_CLIENT_SECRET}
    client_secret: quickstart-oidc-secret
    consumer: mobile-app
    scopes:
      - openid
      - profile
    fail_open: false
    introspection_cache_ttl_s: 60

# HMAC request-signing verification (DW-036).
hmac_auth:
  max_clock_skew_secs: 300

# mTLS client-certificate consumer mapping (DW-035): maps verified
# client certificates to consumers by subject CN.
mtls_consumer_mapping:
  enabled: true
  subject_cn_mapping:
    dwara-admin-client: partner-mtls

# Identity-forwarding headers for mTLS (DW-035).
mtls_forward_headers:
  enabled: true
  prefix: X-Client-Cert

# ---------------------------------------------------------------------------
# Admin API (mTLS-only, DW-022)
# ---------------------------------------------------------------------------

admin:
  bind: 0.0.0.0:2019
  tls:
    cert_file: /etc/dwara/certs/server.crt
    key_file: /etc/dwara/certs/server.key
    client_ca_file: /etc/dwara/certs/client-ca.crt

# ---------------------------------------------------------------------------
# Analytics (DW-043, DW-092, DW-120, DW-102)
# ---------------------------------------------------------------------------

analytics:
  path: /var/lib/dwara/analytics.db
  flush_ms: 1000
  # Custom dimensions (DW-043/DW-093): request-header-sourced tags
  # that become analytics dimensions.
  dimensions:
    - name: api_version
      header: X-API-Version
    - name: client_type
      header: X-Client-Type
    - name: team
      claim: team
      source: claim
  # Per-store retention (defaults shown).
  retention:
    raw_ms: 86400000
    m1_ms: 172800000
    m5_ms: 604800000
    h1_ms: 2592000000
    d1_ms: 7776000000
  # Live in-process sketches (DW-092): sub-second freshness.
  live_sketches:
    enabled: true
    freshness_target_ms: 500
  # ML traffic insights (DW-092): forecasting + anomaly detection.
  insights:
    forecast: true
    anomaly_baseline: true
    baseline_windows: 1440
  # Scheduled usage-report exports (DW-120).
  exports:
    directory: /var/lib/dwara/exports
    formats:
      - csv
      - json
    window: daily
  # Replay time-travel debugging capture (DW-102).
  replay_capture:
    enabled: false
    capture_headers: true
    capture_body: false
    retain_hours: 24

# Real-time access-record stream (DW-121): NDJSON firehose to a
# webhook sink. Fire-and-forget; never blocks the dataplane.
