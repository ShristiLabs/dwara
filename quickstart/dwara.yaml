# Quickstart gateway config (DW-026): TLS-terminated proxy in front of
# the demo nginx upstream. Run `gen-certs.sh` first (writes ./certs),
# then `docker compose up` from this directory.
listeners:
  - name: tls
    address: 0.0.0.0
    port: 8443
    protocol: https
    tls:
      mode: terminate
      cert_file: /etc/dwara/certs/server.crt
      key_file: /etc/dwara/certs/server.key
routes:
  - name: demo
    service: demo
    match:
      # Regex catch-all: validation rejects prefix "/" (it trims to the
      # empty string and would shadow every route).
      path:
        type: regex
        value: /.*
    action:
      type: proxy
services:
  - name: demo
    upstream: demo-upstream
upstreams:
  - name: demo-upstream
    endpoints:
      - address: upstream
        port: 80
